  /* ---------------------------------------------------------- Editor -- */
  const EditBar = {
    render() {
      const el = $('#editBar'), e = S.edit;
      if (!e) { el.classList.add('hidden'); return; }
      el.classList.remove('hidden');
      if (e.mode === 'draw') {
        el.innerHTML = `<span class="msg">지도를 눌러 꼭짓점을 찍으세요 (${e.verts.length}개)</span><button class="btn sm" data-e="undo" ${e.verts.length ? '' : 'disabled'}>되돌리기</button><button class="btn sm primary" data-e="done" ${e.verts.length >= 3 ? '' : 'disabled'}>완료</button><button class="btn sm ghost" data-e="cancel">취소</button>`;
      } else {
        el.innerHTML = `<span class="msg">점을 끌어 옮기고, 빈 곳을 누르면 점이 추가됩니다</span><button class="btn sm" data-e="delv" ${e.selV != null && e.verts.length > 3 ? '' : 'disabled'}>선택한 점 삭제</button><button class="btn sm primary" data-e="done">완료</button><button class="btn sm ghost" data-e="cancel">취소</button>`;
      }
      el.onclick = (ev) => { const b = ev.target.closest('[data-e]'); if (b) Editor.cmd(b.dataset.e); };
    },
  };
  const Editor = {
    startDraw(zoneId = null) { S.edit = { mode: 'draw', verts: [], zoneId }; Panel.hideTemporarily(!WIDE()); EditBar.render(); MV.drawEdit(); },
    startVertex(zoneId) {
      const z = S.zones.find((q) => q.id === zoneId);
      if (!z) return;
      if (z.sensitive) toast('민감 구역은 실제 경계를 편집하고, 지도에는 격자로 표시됩니다.');
      S.edit = { mode: 'vertex', verts: z.geom.map((p) => p.slice()), zoneId, selV: null };
      MV.fit(z.geom, 17);
      EditBar.render(); MV.drawEdit();
    },
    mapClick(ll, pt) {
      const e = S.edit;
      if (e.mode === 'draw') { e.verts.push(ll); }
      else {
        const hit = MV.map.queryRenderedFeatures([[pt.x - 8, pt.y - 8], [pt.x + 8, pt.y + 8]], { layers: ['navi-editv'] });
        if (hit.length) { e.selV = hit[0].properties.i; }
        else {
          const Pp = Geo.proj(ll), xy = e.verts.map(Pp.fwd);
          let best = 0, bd = Infinity;
          for (let i = 0; i < xy.length; i++) { const r = Geo.segProj([0, 0], xy[i], xy[(i + 1) % xy.length]); if (r.d < bd) { bd = r.d; best = i; } }
          e.verts.splice(best + 1, 0, ll); e.selV = best + 1;
        }
      }
      EditBar.render(); MV.drawEdit();
    },
    cmd(c) {
      const e = S.edit;
      if (!e) return;
      if (c === 'undo') e.verts.pop();
      if (c === 'delv' && e.selV != null && e.verts.length > 3) { e.verts.splice(e.selV, 1); e.selV = null; }
      if (c === 'cancel') { S.edit = null; Panel.hideTemporarily(false); }
      if (c === 'done') {
        if (e.verts.length < 3) return;
        let z = e.zoneId && S.zones.find((q) => q.id === e.zoneId);
        if (z) { z.geom = e.verts; z.updated = Time.iso(Date.now()); if (z.source === 'demo' || z.source === 'terrain') z.source = 'user'; }
        else {
          z = Zones.normalize({ name: '새 구역', grade: 'E3', q: 'Q4', verification: 'unverified', source: 'user', updated: Time.iso(Date.now()), geom: e.verts });
          S.zones.push(z);
        }
        saveZones(); S.edit = null; Panel.hideTemporarily(false);
        MV.drawZones(); Panel.open('zoneForm', z.id, { push: true });
        toast('구역 모양을 저장했습니다.');
      }
      EditBar.render(); MV.drawEdit();
    },
  };

  /* -------------------------------------------------------------- HUD -- */
  const Hud = {
    show(on) {
      document.body.classList.toggle('monitoring', on);
      ['#hud', '#hudBar', '#hudNote'].forEach((s) => $(s).classList.toggle('hidden', !on));
      if (!on) { $('#alertBanner').classList.add('hidden'); $('#nextMan').classList.add('hidden'); }
    },
    bar() {
      const m = S.mon;
      if (!m) return;
      const simCtl = m.sim ? `<button class="btn" data-h="scen">${ic('ship')}${{ normal: '정상 주행', deviate: '이탈 시험', poor: '정확도 나쁨' }[m.sim.o.scenario]}</button>
        <button class="btn" data-h="speed">${m.scale}배속</button><button class="btn" data-h="pause">${ic(m.paused ? 'play' : 'pause')}${m.paused ? '계속' : '일시정지'}</button>` : '';
      $('#hudBar').innerHTML = `${simCtl}<button class="btn" data-h="reroute">${ic('refresh')}경로 재계산</button><button class="btn" data-h="mute">${ic(m.muted ? 'mute' : 'sound')}${m.muted ? '알림 소리 켜기' : '알림 소리 끄기'}</button><button class="btn danger" data-h="stop">${ic('stop')}감시 종료</button>`;
      $('#hudBar').onclick = (e) => { const b = e.target.closest('[data-h]'); if (b) App.hudCmd(b.dataset.h); };
    },
    note() {
      const m = S.mon;
      if (!m) return;
      const wake = m.sim ? '' : Wake.supported ? (Wake.lock ? ' 화면 꺼짐 방지 켜짐.' : ' 화면 꺼짐 방지를 켜지 못했습니다.') : ' 이 브라우저는 화면 꺼짐 방지를 지원하지 않습니다.';
      $('#hudNote').textContent = m.sim ? '모의 항해 중입니다. 실제 위치 대신 경로를 따라 만든 위치를 씁니다.' : '웹 버전은 화면이 켜져 있을 때만 감시합니다.' + wake;
    },
    render(st) {
      const m = S.mon, o = m.mon.opts;
      const kmh = st.speed != null ? st.speed * 3.6 : null;
      const crs = st.course != null ? String(Math.round(st.course) % 360).padStart(3, '0') + '도' : '-';
      const devCls = st.status === 'deviated' ? 'bad' : st.status === 'uncertain' ? 'warn' : '';
      const devTxt = st.status === 'uncertain' ? `판단 보류<small>정확도 ${Math.round(st.acc)}m</small>` : `${Math.round(st.xte)}m<small>/ ${o.xtl}m</small>`;
      const wpTxt = st.nextWp ? `${esc(st.nextWp.name || '경유점')} <small>${Util.fmtDist(st.nextWp.dist)}</small>` : `${Util.fmtDist(st.remain)}<small>도착까지</small>`;
      const accTxt = `${Math.round(st.acc)}m<small>${S.pos && S.pos.sim ? '모의' : st.acc <= 15 ? 'GNSS 수준' : st.acc <= 50 ? '보통' : 'Wi-Fi 추정'}</small>`;
      let ttz = '없음', ttzCls = '';
      if (st.inZone) { ttz = `통과 중<small>${esc(st.inZone.grade || '')}</small>`; ttzCls = 'hl'; }
      else if (st.ttz) { ttz = `${Util.fmtMinSec(st.ttz.sec)}<small>${st.ttz.grade}${st.ttz.active ? '' : ' 비활성'}</small>`; if (st.ttz.active && st.ttz.sec <= o.a1) ttzCls = 'hl'; }
      $('#inst').innerHTML = `<div><div class="k">속도</div><div class="v">${kmh != null ? Math.round(kmh) : '-'}<small>km/h</small></div></div>
        <div><div class="k">진행 방향</div><div class="v">${crs}</div></div>
        <div class="${devCls}"><div class="k">경로 이탈 / 한계</div><div class="v">${devTxt}</div></div>
        <div><div class="k">${st.nextWp ? '다음 경유점' : '남은 거리'}</div><div class="v">${wpTxt}</div></div>
        <div class="${st.acc > o.xtl ? 'warn' : ''}"><div class="k">위치 정확도</div><div class="v">${accTxt}</div></div>
        <div class="${ttzCls}"><div class="k">구역 진입까지</div><div class="v">${ttz}</div></div>`;
      const nm = $('#nextMan');
      if (st.nextMan) { nm.classList.remove('hidden'); nm.innerHTML = `${ic('route').replace('<svg', '<svg width="26" height="26"')}<div><b>${Util.fmtDist(st.nextMan.dist)} 뒤</b><div>${esc(st.nextMan.text)}</div></div>`; }
      else nm.classList.add('hidden');
    },
    alert(a, st) {
      const el = $('#alertBanner');
      const sub = a.kind === 'approach' && st.ttz ? `${esc(st.ttz.name)}${st.ttz.actions && st.ttz.actions.length ? ' | 권고: ' + esc(st.ttz.actions.join(', ')) : ''}` : a.kind === 'inzone' && st.inZone ? `권고: ${esc((st.inZone.actions || []).join(', ') || '천천히 지나가기')}` : a.kind === 'deviation' ? (S.mon && S.mon.sim ? '모의 항해 중 이탈 시나리오입니다.' : '30초 안에 경로로 돌아오지 않으면 경로를 다시 계산합니다.') : '';
      el.className = 'lv' + a.level;
      el.innerHTML = `${ic(a.level >= 2 ? 'warn' : 'info').replace('<svg', '<svg width="26" height="26" style="flex:none"')}<div><div class="t">${esc(a.text)}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`;
      el.classList.remove('hidden');
      clearTimeout(this._t);
      this._t = setTimeout(() => el.classList.add('hidden'), a.level >= 2 ? 20000 : 10000);
      el.onclick = () => el.classList.add('hidden');
      Voice.beep(a.level);
      Voice.say(a.text);
    },
  };

  /* -------------------------------------------------------------- App -- */
  const App = {
    async boot() {
      renderTopbar(); renderLegend(); renderChips();
      MV.init();
      this.bindUi();
      if (!S.zones.length && S.center) { S.zones = Zones.demo(S.center); saveZones(); }
      if (!S.center) this.initCenter();
      else if (!S.terrainDone) MV.map.once('idle', () => this.terrainFit(true));
      setInterval(() => { if (S.timeMode === 'now') { renderChips(); MV.drawZones(); Panel.refreshIf(['layers', 'zone']); } }, 30000);
      try {
        if (navigator.permissions && navigator.permissions.query) {
          const p = await navigator.permissions.query({ name: 'geolocation' });
          if (p.state === 'granted') Loc.start(false);
          else $('#btnLocate').classList.add('pulse');
        } else $('#btnLocate').classList.add('pulse');
      } catch (e) { $('#btnLocate').classList.add('pulse'); }
      if (!store.get('welcomed', false)) {
        store.set('welcomed', true);
        setTimeout(() => toast('지도를 길게 누르면 도착지, 경유점, 제보 위치를 정할 수 있어요.', false, 6000), 6500);
      }
    },
    async initCenter() {
      let center = null, label = '';
      try {
        const res = await Geocoder.search('선덕고등학교', FALLBACK_CENTER);
        const hit = res.find((r) => /선덕고/.test(r.name) || /선덕고/.test(r.display));
        if (hit) { center = [hit.lon, hit.lat]; label = '선덕고등학교'; }
      } catch (e) { /* offline or blocked */ }
      if (!center) { center = FALLBACK_CENTER; label = '쌍문역 부근(대략)'; toast('선덕고 위치를 찾지 못해 쌍문역 주변으로 시작합니다. 지도를 길게 눌러 시험 지역 중심을 바꿀 수 있어요.', false, 7000); }
      this.setCenter(center, label, true);
    },
    setCenter(ll, label, auto = false) {
      S.center = ll; S.centerLabel = label || fmtLL(ll);
      store.set('center', S.center); store.set('centerLabel', S.centerLabel);
      const keep = S.zones.filter((z) => z.source === 'user' || z.source === 'import');
      S.zones = Zones.demo(ll).concat(keep);
      saveZones();
      S.terrainDone = false; store.set('terrainDone', false);
      MV.drawZones(); MV.drawCenter(); renderChips(); Panel.refreshIf(['layers', 'editor']);
      MV.map.flyTo({ center: ll, zoom: 14.6, padding: MV.camPad(), duration: 900 });
      MV.map.once('moveend', () => MV.map.once('idle', () => this.terrainFit(true)));
      if (!auto) toast(`시험 지역을 ${S.centerLabel} 주변으로 옮겼습니다.`);
    },
    terrainFit(auto = false) {
      if (!S.center) return;
      const getFeatures = (layer) => {
        if (window.__NAVI_TEST_TERRAIN) return window.__NAVI_TEST_TERRAIN[layer] || [];
        try { return MV.map.getSource('openmaptiles') ? MV.map.querySourceFeatures('openmaptiles', { sourceLayer: layer }) : []; } catch (e) { return []; }
      };
      const run = () => {
        const base = Zones.demo(S.center);
        const out = Terrain.fit(base, S.center, getFeatures);
        if (!out.report.length) { if (!auto) toast('주변 지도에서 하천이나 녹지를 찾지 못해 기본 배치를 유지합니다.'); return; }
        const keep = S.zones.filter((z) => z.source === 'user' || z.source === 'import');
        S.zones = out.zones.concat(keep);
        saveZones(); S.terrainDone = true; store.set('terrainDone', true);
        S.terrainReport = out.report; store.set('terrainReport', out.report);
        MV.drawZones(); Panel.refreshIf(['layers', 'editor']);
        toast(`${S.centerLabel || '시험 지역'} 주변 지형(하천, 녹지)에 맞춰 시험 구역을 배치했습니다.`, false, 5000);
      };
      const near = Geo.dist([MV.map.getCenter().lng, MV.map.getCenter().lat], S.center) < 800 && MV.map.getZoom() >= 13.8;
      if (near && MV.map.loaded()) run();
      else { MV.map.flyTo({ center: S.center, zoom: 14.6, duration: 600 }); MV.map.once('moveend', () => MV.map.once('idle', run)); }
    },
    bindUi() {
      $('#searchForm').onsubmit = (e) => { e.preventDefault(); this.search($('#searchInput').value); $('#searchInput').blur(); };
      $('#modeSeg').onclick = (e) => { const b = e.target.closest('[data-mode]'); if (b) this.setMode(b.dataset.mode); };
      $('#ecoToggle').onclick = () => { S.eco = !S.eco; store.set('eco', S.eco); renderTopbar(); renderChips(); MV.drawZones(); this.planChanged(true); Panel.refreshIf(['layers', 'plan']); toast(S.eco ? '생태 보호 모드를 켰습니다.' : '생태 보호 모드를 껐습니다. 법적 통제만 반영합니다.'); };
      $('#menuBtn').onclick = () => Menu.toggle();
      $('#panelClose').onclick = () => Panel.close();
      $('#panelBack').onclick = () => Panel.back();
      $('#timeChip').onclick = () => Panel.open('time');
      $('#posChip').onclick = () => { if (S.pos) MV.flyTo([S.pos.lon, S.pos.lat]); };
      $('#btnLocate').onclick = () => Loc.locateBtn();
      $('#btnLayers').onclick = () => (S.panel && S.panel.name === 'layers' ? Panel.close() : Panel.open('layers'));
      $('#btnRoute').onclick = () => (S.panel && S.panel.name === 'plan' ? Panel.close() : Panel.open('plan'));
      $('#btnReport').onclick = () => (S.panel && S.panel.name === 'report' ? Panel.close() : (S.draft = null, Panel.open('report')));
      const body = $('#panelBody');
      body.addEventListener('click', (e) => { const a = e.target.closest('[data-act]'); if (a && Actions[a.dataset.act]) { e.preventDefault(); Actions[a.dataset.act](a, e); } });
      body.addEventListener('change', (e) => {
        const el = e.target;
        if (el.dataset.layer) { S.layers[el.dataset.layer] = el.checked; store.set('layers', S.layers); MV.drawZones(); MV.drawReports(); }
        if (el.dataset.set) this.setSetting(el);
      });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { Ctx.hide(); Menu.hide(); if (S.pick) Pick.cancel(); else if (S.edit) Editor.cmd('cancel'); else if (S.panel) Panel.close(); } });
      document.addEventListener('click', (e) => { if (!e.target.closest('#menu') && !e.target.closest('#menuBtn')) Menu.hide(); if (!e.target.closest('#ctx') && !e.target.closest('#map')) Ctx.hide(); });
      window.addEventListener('resize', () => renderChips());
    },
    setSetting(el) {
      const k = el.dataset.set;
      let v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? parseFloat(el.value) : el.value;
      if (el.type === 'number' && !Number.isFinite(v)) return;
      S.settings[k] = v; saveSettings(); applySettings();
      if (k === 'basemap') MV.setBasemap(v);
      if (k === 'provider') { MV.setAttribution(); Panel.render(); }
      if (k === 'theme') renderLegend();
    },
    setMode(m) {
      if (m !== 'walk' && m !== 'car') return;
      S.mode = m; store.set('mode', m);
      renderTopbar(); renderChips(); MV.drawZones();
      this.planChanged(true);
      Panel.refreshIf(['layers', 'zone', 'plan']);
    },
    setTime(t) {
      if (t == null) { S.timeMode = 'now'; S.customT = null; }
      else { S.timeMode = 'custom'; S.customT = t; }
      renderChips(); MV.drawZones(); Panel.refreshIf(['time', 'layers', 'zone', 'plan']);
    },
    planChanged(clearResult = true) {
      if (clearResult) { S.result = null; S.selCid = null; S.planError = null; MV.drawRoutes(); }
      MV.drawWaypoints();
      Panel.refreshIf(['plan']);
    },
    async search(q) {
      q = String(q || '').trim();
      if (!q) return;
      S.searchQ = q; S.searching = true; S.searchResults = [];
      Panel.open('search');
      try {
        const c = MV.map.getCenter();
        S.searchResults = await Geocoder.search(q, [c.lng, c.lat]);
      } catch (e) { toast(e.message || '검색에 실패했습니다.', true); }
      S.searching = false;
      Panel.render(); MV.drawWaypoints();
      if (S.searchResults.length) MV.fit(S.searchResults.map((r) => [r.lon, r.lat]), 16);
    },
    ctxAction(c, ll) {
      if (c === 'dest') { S.plan.dest = { ll, label: fmtLL(ll) }; this.planChanged(); Panel.open('plan'); }
      else if (c === 'origin') { S.plan.origin = { kind: 'point', ll, label: fmtLL(ll) }; this.planChanged(); Panel.open('plan'); }
      else if (c === 'wp') { S.plan.waypoints.push({ id: Util.uid('W'), ll, label: '경유점 ' + (S.plan.waypoints.length + 1), must: true }); this.planChanged(); Panel.open('plan'); }
      else if (c === 'report') { S.draft = this.newDraft(); S.draft.ll = ll; S.draft.acc = null; Panel.open('report'); }
      else if (c === 'reportPick') { if (S.draft) { S.draft.ll = ll; S.draft.acc = null; } Panel.open('report'); }
      else if (c === 'center') {
        modal('시험 지역 중심 바꾸기', '이 지점 주변으로 기본 시험 구역을 다시 배치합니다. 직접 그리거나 가져온 구역은 그대로 둡니다.', [{ label: '바꾸기', cls: 'primary', value: true }, { label: '취소', value: false }])
          .then((yes) => { if (yes) this.setCenter(ll, ''); });
      } else if (c === 'copy') {
        const txt = `${ll[1].toFixed(6)}, ${ll[0].toFixed(6)}`;
        if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('좌표를 복사했습니다: ' + txt), () => toast(txt));
        else toast(txt);
      }
    },
    openZone(id) {
      S.selZone = id; S.evidOpen = false; MV.drawZones();
      Panel.open('zone', id, { push: !!(S.panel && S.panel.name === 'layers') });
    },
    selectCand(cid) {
      if (!S.result || !S.result.cands) return;
      S.selCid = cid; MV.drawRoutes();
      if (!S.panel || S.panel.name !== 'plan') Panel.open('plan'); else Panel.render();
    },
    newDraft() {
      return { kind: 'dead', taxa: '모름', surface: 'asphalt', mode: S.mode, t: Date.now(), ll: S.pos ? [S.pos.lon, S.pos.lat] : null, acc: S.pos ? S.pos.acc : null, vis: 'hidden', memo: '', photoId: null, photoUrl: null };
    },
    async addPhoto(file) {
      if (!file || !S.draft) return;
      try {
        const url = URL.createObjectURL(file);
        const img = new Image();
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
        const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.82));
        const id = Util.uid('P');
        try { await IDB.put(id, blob); S.draft.photoId = id; } catch (e) { toast('사진을 기기에 저장하지 못했습니다. 사진 없이 제보할 수 있습니다.', true); }
        S.draft.photoUrl = URL.createObjectURL(blob);
        Panel.render();
      } catch (e) { toast('사진을 읽지 못했습니다.', true); }
    },
    openReportItem(id) {
      const r = S.reports.find((q) => q.id === id);
      if (!r) return;
      Panel.open('reports');
      MV.flyTo(r.ll, 17);
    },
    zoneFormInput(z, e) {
      const el = e.target;
      if (el.dataset.zf) {
        const k = el.dataset.zf;
        if (k === 'modes' || k === 'mechanisms' || k === 'evidence') {
          const set = new Set(z[k]); if (el.checked) set.add(el.value); else set.delete(el.value); z[k] = [...set];
        } else if (k === 'sensitive') { z.sensitive = el.checked; z.publicRes = el.checked ? 1000 : 0; }
        else if (k === 'actions') z.actions = el.value.split(',').map((s) => s.trim()).filter(Boolean);
        else if (k === 'buffer') z.buffer = Util.clamp(parseFloat(el.value) || 0, 0, 300);
        else z[k] = el.value;
        if (e.type === 'change' && ['kind', 'legal', 'grade'].includes(k)) { Object.assign(z, Zones.normalize(z)); Panel.render(); }
      }
      if (el.dataset.win) {
        const arr = z[el.dataset.win], i = +el.dataset.i;
        if (arr[i]) arr[i][el.dataset.e] = el.value.trim();
      }
    },
    async importZones(file) {
      if (!file) return;
      try {
        const txt = await file.text();
        const zs = Zones.fromGeoJSON(JSON.parse(txt));
        if (!zs.length) { toast('구역을 찾지 못했습니다. GeoJSON 다각형 파일인지 확인해 주세요.', true); return; }
        const v = await modal('구역 가져오기', `${zs.length}개 구역을 찾았습니다. 어떻게 할까요?`, [{ label: '기존 구역에 추가', cls: 'primary', value: 'merge' }, { label: '모두 바꾸기', value: 'replace' }, { label: '취소', value: null }]);
        if (!v) return;
        const ids = new Set(S.zones.map((z) => z.id));
        zs.forEach((z) => { if (ids.has(z.id)) z.id = Util.uid('Z'); });
        S.zones = v === 'replace' ? zs : S.zones.concat(zs);
        saveZones(); MV.drawZones(); Panel.render();
        toast(`${zs.length}개 구역을 가져왔습니다.`);
      } catch (e) { toast('파일을 읽지 못했습니다: ' + (e.message || ''), true); }
    },
    /* ------------------------------ planning ------------------------------ */
    async planRoute() {
      const pl = S.plan;
      const origin = pl.origin.kind === 'gps' ? (S.pos ? [S.pos.lon, S.pos.lat] : null) : pl.origin.ll;
      if (!origin) { toast('현재 위치를 아직 모릅니다. 위치 권한을 허용하거나 출발점을 지도에서 골라 주세요.', true); return; }
      if (!pl.dest) { toast('도착지를 먼저 정해 주세요.', true); return; }
      if (Geo.dist(origin, pl.dest.ll) < 15) { toast('출발지와 도착지가 너무 가깝습니다.', true); return; }
      S.planning = true; S.planError = null; S.result = null; S.progress = '경로를 찾는 중';
      MV.drawRoutes(); Panel.render();
      try {
        const res = await Planner.plan({
          origin, dest: pl.dest.ll, waypoints: pl.waypoints.map((w) => ({ ll: w.ll, must: w.must })), mode: S.mode, t0: departT(), eco: S.eco, zones: S.zones,
          settings: S.settings, onProgress: (m) => { S.progress = m; const el = $('#progTxt'); if (el) el.textContent = m; },
        });
        S.result = res;
        if (res.status !== 'fail') {
          S.selCid = res.sel.rec.cid;
          const all = res.cands.filter((c) => !c.ev.violations.length).flatMap((c) => c.route.coords);
          if (res.entryLeg) all.push(res.entryLeg.to);
          if (res.exitLeg) all.push(res.exitLeg.from);
          MV.fit(all);
        } else if (res.problems && res.problems[0]) {
          S.selZone = res.problems[0].id; MV.drawZones();
          MV.fit([origin, pl.dest.ll].concat(Zones.workGeom(res.problems[0])));
        }
      } catch (e) {
        const hint = { network: '인터넷 연결을 확인하세요. 계속 안 되면 설정에서 경로 서버를 바꿔 보세요.', timeout: '잠시 뒤 다시 시도해 주세요.', rate: '1분쯤 기다렸다가 다시 시도해 주세요.', toolong: '도착지를 더 가까운 곳으로 정하거나 경유점을 넣어 나눠 보세요.', auth: '설정의 경로 서버와 키를 확인해 주세요.', config: '설정에서 경로 서버 주소를 확인해 주세요.' }[e.kind] || '';
        S.planError = { msg: e.message || '경로를 찾지 못했습니다.', hint };
      }
      S.planning = false;
      MV.drawRoutes(); Panel.render();
    },
    /* ----------------------------- monitoring ----------------------------- */
    startMonitor(sim) {
      const R = S.result, sel = R && R.cands && R.cands.find((c) => c.cid === S.selCid);
      if (!sel) return;
      if (!sim && !S.pos) { toast('현재 위치를 아직 모릅니다. 위치 권한을 허용해 주세요. 집에서 시험하려면 모의 항해를 쓰세요.', true); Loc.start(true); return; }
      Voice.unlock();
      const st = S.settings, car = S.mode === 'car';
      const mon = new Monitor({ route: sel.route, ev: sel.ev, waypoints: S.plan.waypoints.map((w, i) => ({ ll: w.ll, name: w.label || '경유점 ' + (i + 1) })) }, {
        mode: S.mode, xtl: car ? st.xtlCar : st.xtlWalk, a1: car ? st.aCar1 : st.aWalk1, a1m: car ? st.aCar1m : st.aWalk1m, a2: car ? st.aCar2 : st.aWalk2, zones: S.zones, t0: departT(), eco: S.eco,
      });
      S.mon = { mon, sim: null, timer: null, muted: false, paused: false, scale: 1, startedAt: Date.now(), devCount: 0, cid: sel.cid };
      if (sim) {
        const simr = new Simulator(sel.route.coords, { kmh: car ? 35 : 5, acc: 8, noise: 2, scenario: 'normal' });
        simr.t = departT();
        S.mon.sim = simr;
        this.simLoop();
      } else {
        Wake.on();
        Loc.start(false);
      }
      Panel.close();
      Hud.show(true); Hud.bar(); Hud.note();
      MV.drawRoutes();
      Voice.say(sim ? '모의 항해를 시작합니다.' : '항로 감시를 시작합니다.');
      if (S.pos && !sim) this.onFix({ lon: S.pos.lon, lat: S.pos.lat, acc: S.pos.acc, speed: S.pos.speed, heading: S.pos.heading, t: Date.now() });
      MV.map.easeTo({ center: sel.route.coords[0], zoom: Math.max(MV.map.getZoom(), car ? 15.5 : 16.5), padding: { top: 140, bottom: 80, left: 40, right: 40 }, duration: 600 });
    },
    simLoop() {
      const m = S.mon;
      if (!m || !m.sim) return;
      clearInterval(m.timer);
      m.timer = setInterval(() => {
        if (m.paused) return;
        const f = m.sim.next(1);
        S.pos = { lon: f.lon, lat: f.lat, acc: f.acc, speed: f.speed, heading: null, t: f.t, sim: true };
        this.onFix(f);
        if (f.done) { clearInterval(m.timer); m.timer = null; }
      }, Math.round(1000 / m.scale));
    },
    onFix(f) {
      const m = S.mon;
      if (!m) return;
      const st = m.mon.update(f);
      m.last = st;
      if (st.status === 'deviated') m.devCount++;
      MV.drawPos(); renderChips();
      Hud.render(st);
      for (const a of st.alerts) Hud.alert(a, st);
      if (st.reroute) this.reroute(true);
      if (st.status === 'arrived' && !m.arrived) {
        m.arrived = true;
        Hud.alert({ level: 0, kind: 'arrive', text: '목적지에 도착했습니다.' }, st);
        if (m.sim) { clearInterval(m.timer); m.timer = null; }
      }
      if (Date.now() > S.followUntil) MV.map.easeTo({ center: [f.lon, f.lat], padding: { top: 150, bottom: 90, left: 40, right: 40 }, duration: 400 });
    },
    async reroute(auto) {
      const m = S.mon;
      if (!m || m.rerouting) return;
      const from = S.pos ? [S.pos.lon, S.pos.lat] : null;
      if (!from) return;
      m.rerouting = true;
      toast(auto ? '경로에서 벗어나 경로를 다시 계산합니다.' : '경로를 다시 계산합니다.');
      try {
        const st = m.last;
        const remainWps = S.plan.waypoints.filter((w) => { const mw = m.mon.waypoints.find((q) => q.ll === w.ll); return !mw || !st || mw.s > st.s; });
        const res = await Planner.plan({ origin: from, dest: S.plan.dest.ll, waypoints: remainWps.map((w) => ({ ll: w.ll })), mode: S.mode, t0: Date.now(), eco: S.eco, zones: S.zones, settings: Object.assign({}, S.settings, { maxCandidates: 2 }) });
        if (res.status === 'fail') { toast('다시 계산했지만 조건을 만족하는 경로가 없습니다. 안전한 곳에 멈춰 확인해 주세요.', true); }
        else {
          S.result = res; S.selCid = res.sel.rec.cid;
          const sel = res.sel.rec, o = m.mon.opts;
          const track = m.mon.track;
          m.mon = new Monitor({ route: sel.route, ev: sel.ev, waypoints: remainWps.map((w, i) => ({ ll: w.ll, name: w.label || '경유점 ' + (i + 1) })) }, Object.assign({}, o, { t0: Date.now() }));
          m.mon.track = track;
          if (m.sim) { const sp = m.sim.o; const t = m.sim.t; m.sim = new Simulator(sel.route.coords, sp); m.sim.t = t; }
          MV.drawRoutes();
          Voice.say('새 경로로 안내합니다.');
        }
      } catch (e) { toast('경로를 다시 계산하지 못했습니다: ' + (e.message || ''), true); }
      m.rerouting = false;
    },
    hudCmd(c) {
      const m = S.mon;
      if (!m) return;
      if (c === 'stop') return this.stopMonitor();
      if (c === 'mute') { m.muted = !m.muted; if (m.muted && window.speechSynthesis) speechSynthesis.cancel(); Hud.bar(); }
      if (c === 'reroute') this.reroute(false);
      if (c === 'pause') { m.paused = !m.paused; Hud.bar(); }
      if (c === 'speed') { m.scale = m.scale === 1 ? 5 : m.scale === 5 ? 10 : 1; this.simLoop(); Hud.bar(); }
      if (c === 'scen') {
        const order = ['normal', 'deviate', 'poor'];
        const next = order[(order.indexOf(m.sim.o.scenario) + 1) % order.length];
        m.sim.o.scenario = next; Hud.bar();
        toast({ normal: '정상 주행으로 바꿨습니다.', deviate: '경로 중간에서 옆길로 벗어나는 시나리오입니다.', poor: 'Wi-Fi처럼 정확도가 나쁜 위치를 만듭니다.' }[next]);
      }
    },
    stopMonitor() {
      const m = S.mon;
      if (!m) return;
      clearInterval(m.timer);
      Wake.off();
      if (window.speechSynthesis) speechSynthesis.cancel();
      const mins = Math.round((Date.now() - m.startedAt) / 60000);
      const track = m.mon.track.slice();
      S.mon = null;
      if (S.pos && S.pos.sim) S.pos = S.realPos ? Object.assign({}, S.realPos) : null;
      Hud.show(false);
      MV.drawRoutes(); MV.drawPos(); renderChips();
      if (S.settings.trackConsent && track.length > 1) {
        const gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="NAVI ${NaviCore.NAVI_VERSION}" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>NAVI track</name><trkseg>${track.map((p) => `<trkpt lat="${p[1].toFixed(6)}" lon="${p[0].toFixed(6)}"/>`).join('')}</trkseg></trk></gpx>`;
        download(`navi-track-${stamp()}.gpx`, gpx, 'application/gpx+xml');
      }
      toast(`감시를 마쳤습니다. ${mins ? mins + '분 동안 ' : ''}이탈 판정 ${m.devCount ? '있음' : '없음'}.`);
      Panel.open('plan');
    },
  };

  /* --------------------------------------------------------- Actions -- */
  const Actions = {
    open: (el) => Panel.open(el.dataset.p, null, { push: true }),
    zone: (el) => App.openZone(el.dataset.id),
    zoneView: (el) => { const z = S.zones.find((q) => q.id === el.dataset.id); if (z) { MV.fit(Zones.workGeom(z), 16.5); App.openZone(z.id); } },
    toggleEvid: () => { S.evidOpen = !S.evidOpen; Panel.render(); },
    reportZone: (el) => { const z = S.zones.find((q) => q.id === el.dataset.id); S.draft = App.newDraft(); if (z) { S.draft.ll = Zones.center(z); S.draft.acc = null; S.draft.memo = z.name + ' 구역 제보'; } Panel.open('report', null, { push: true }); },
    editZone: (el) => Panel.open('zoneForm', el.dataset.id, { push: true }),
    obs: (el) => { const z = S.zones.find((q) => q.id === el.dataset.id); if (z) { z.obs = el.dataset.v || null; saveZones(); MV.drawZones(); renderChips(); Panel.render(); } },
    timePreset: (el) => {
      const k = el.dataset.k, c = S.center || FALLBACK_CENTER, now = Date.now(), st = Sun.forT(now, c[1], c[0]);
      const y = Time.kst(now).y;
      if (k === 'now') App.setTime(null);
      if (k === 'sunset') App.setTime(st.set);
      if (k === 'sunset1') App.setTime(st.set + 3600000);
      if (k === 'ex1') App.setTime(Time.fromKst(y, 6, 21, 20, 40));
      if (k === 'ex2') App.setTime(Time.fromKst(y, 1, 10, 20, 30));
    },
    searchDest: (el) => { const r = S.searchResults[+el.dataset.i]; if (!r) return; S.plan.dest = { ll: [r.lon, r.lat], label: r.name }; S.searchResults = []; App.planChanged(); Panel.open('plan'); },
    searchOrigin: (el) => { const r = S.searchResults[+el.dataset.i]; if (!r) return; S.plan.origin = { kind: 'point', ll: [r.lon, r.lat], label: r.name }; S.searchResults = []; App.planChanged(); Panel.open('plan'); },
    searchView: (el) => { const r = S.searchResults[+el.dataset.i]; if (r) MV.flyTo([r.lon, r.lat], 16.5); },
    pickOrigin: async () => {
      const v = await modal('출발점 바꾸기', '어디서 출발할까요?', [{ label: '현재 위치', cls: 'primary', value: 'gps' }, { label: '지도에서 고르기', value: 'map' }, { label: '취소', value: null }]);
      if (v === 'gps') { S.plan.origin = { kind: 'gps' }; Loc.start(true); App.planChanged(); }
      if (v === 'map') Pick.start('origin', '지도를 눌러 출발점을 고르세요');
    },
    pickDest: () => Pick.start('dest', '지도를 눌러 도착지를 고르세요'),
    pickWp: () => Pick.start('wp', '지도를 눌러 경유점을 고르세요'),
    depart: (el) => { S.plan.depart = el.dataset.v; if (el.dataset.v === 'custom' && !Number.isFinite(S.plan.departT)) S.plan.departT = nowT(); App.planChanged(true); },
    mode: (el) => App.setMode(el.dataset.v),
    wpUp: (el) => { const i = +el.dataset.i, w = S.plan.waypoints; if (i > 0) { [w[i - 1], w[i]] = [w[i], w[i - 1]]; App.planChanged(); } },
    wpDown: (el) => { const i = +el.dataset.i, w = S.plan.waypoints; if (i < w.length - 1) { [w[i + 1], w[i]] = [w[i], w[i + 1]]; App.planChanged(); } },
    wpDel: (el) => { S.plan.waypoints.splice(+el.dataset.i, 1); App.planChanged(); },
    fixVia: () => { const sel = S.result && S.result.cands.find((c) => c.cid === S.selCid); if (sel && sel.via) { S.plan.waypoints.push({ id: Util.uid('W'), ll: sel.via.ll, label: sel.via.zoneName + ' 우회점', must: true }); App.planChanged(); toast('자동 경유점을 사용자 경유점으로 고정했습니다.'); } },
    planRoute: () => App.planRoute(),
    cand: (el) => App.selectCand(el.dataset.cid),
    startMon: () => App.startMonitor(false),
    startSim: () => App.startMonitor(true),
    failLater: (el) => { S.plan.depart = 'custom'; S.plan.departT = +el.dataset.t; App.planChanged(); App.planRoute(); },
    failMode: (el) => { App.setMode(el.dataset.v); App.planRoute(); },
    expertReq: () => {
      const R = S.result;
      S.expertReq.push({ t: Date.now(), zones: (R && R.problems || []).map((z) => z.id), dest: S.plan.dest && S.plan.dest.ll });
      store.set('expertReq', S.expertReq);
      toast('확인 요청을 이 기기에 기록했습니다. 검토자 연결은 다음 버전에서 제공합니다.');
    },
    draft: (el) => { if (!S.draft) S.draft = App.newDraft(); S.draft[el.dataset.k] = el.dataset.v; Panel.render(); },
    draftGps: () => { if (!S.pos) { Loc.start(true); toast('위치를 받는 중입니다. 잠시 뒤 다시 눌러 주세요.'); return; } S.draft.ll = [S.pos.lon, S.pos.lat]; S.draft.acc = S.pos.acc; Panel.render(); },
    draftPick: () => Pick.start('reportPick', '지도를 눌러 관찰 위치를 고르세요'),
    submitReport: () => {
      const d = S.draft;
      if (!d || !d.ll) { toast('관찰 위치를 정해 주세요.', true); return; }
      const r = { id: Util.uid('R'), kind: d.kind, taxa: d.taxa, surface: d.surface, mode: d.mode, t: d.t, ll: d.ll, acc: d.acc, vis: d.vis, memo: d.memo, photoId: d.photoId, status: 'unverified', created: Date.now() };
      S.reports.push(r); store.set('reports', S.reports);
      S.draft = null; MV.drawReports();
      toast('제보를 저장했습니다. 검증 전까지 미확정 자료로만 씁니다.');
      Panel.open('reports');
    },
    reportView: (el) => { const r = S.reports.find((q) => q.id === el.dataset.id); if (r) MV.flyTo(r.ll, 17); },
    reportDel: async (el) => {
      const ok = await modal('제보 삭제', '이 제보를 지울까요? 되돌릴 수 없습니다.', [{ label: '삭제', cls: 'danger', value: true }, { label: '취소', value: false }]);
      if (!ok) return;
      const r = S.reports.find((q) => q.id === el.dataset.id);
      if (r && r.photoId) IDB.del(r.photoId).catch(() => {});
      S.reports = S.reports.filter((q) => q.id !== el.dataset.id); store.set('reports', S.reports); MV.drawReports(); Panel.render();
    },
    exportReports: (el) => {
      const KIND = { alive: '살아 있는 곤충', dead: '사체', swarm: '떼 출현' };
      if (el.dataset.f === 'csv') {
        const head = 'id,observed_at_kst,kind,taxa,surface,observer_mode,lat,lon,accuracy_m,visibility,status,memo';
        const rows = S.reports.map((r) => [r.id, Time.toInput(r.t), KIND[r.kind] || r.kind, r.taxa, r.surface, r.mode, r.ll[1].toFixed(6), r.ll[0].toFixed(6), Number.isFinite(r.acc) ? Math.round(r.acc) : '', r.vis, r.status, '"' + String(r.memo || '').replace(/"/g, '""') + '"'].join(','));
        download(`navi-reports-${stamp()}.csv`, '﻿' + [head].concat(rows).join('\n'), 'text/csv');
      } else {
        const fc = { type: 'FeatureCollection', features: S.reports.map((r) => ({ type: 'Feature', properties: { id: r.id, observed_at_kst: Time.toInput(r.t), kind: r.kind, taxa: r.taxa, surface: r.surface, observer_mode: r.mode, accuracy_m: r.acc, visibility: r.vis, status: r.status, memo: r.memo }, geometry: { type: 'Point', coordinates: r.ll } })) };
        download(`navi-reports-${stamp()}.geojson`, JSON.stringify(fc, null, 1), 'application/geo+json');
      }
    },
    drawNew: () => Editor.startDraw(null),
    redraw: (el) => Editor.startDraw(el.dataset.id),
    editVerts: (el) => Editor.startVertex(el.dataset.id),
    winAdd: (el) => { const z = S.zones.find((q) => q.id === S.panel.arg); if (!z) return; z[el.dataset.k].push(el.dataset.kind === 'season' ? { from: '05-01', to: '06-30' } : { from: 'SUNSET+00:00', to: 'SUNSET+03:00' }); Panel.render(); },
    winDel: (el) => { const z = S.zones.find((q) => q.id === S.panel.arg); if (!z) return; z[el.dataset.k].splice(+el.dataset.i, 1); Panel.render(); },
    zoneSave: (el) => {
      const i = S.zones.findIndex((q) => q.id === el.dataset.id);
      if (i < 0) return;
      const z = Zones.normalize(S.zones[i]);
      const bad = [...z.season, ...z.legalSeason].some((w) => !Number.isFinite(Win.md(w.from)) || !Number.isFinite(Win.md(w.to))) || [...z.daily, ...z.legalDaily].some((w) => !Win.anchor(w.from) || !Win.anchor(w.to));
      if (bad) { toast('시기나 시간 형식이 맞지 않습니다. 예: 05-01, SUNSET+03:00, 20:00', true); return; }
      z.updated = Time.iso(Date.now());
      if (z.source === 'demo' || z.source === 'terrain') z.source = 'user';
      S.zones[i] = z; saveZones(); MV.drawZones(); renderChips();
      toast('구역을 저장했습니다.');
      Panel.back();
    },
    zoneDelete: async (el) => {
      const ok = await modal('구역 삭제', '이 구역을 지울까요?', [{ label: '삭제', cls: 'danger', value: true }, { label: '취소', value: false }]);
      if (!ok) return;
      S.zones = S.zones.filter((q) => q.id !== el.dataset.id); saveZones(); MV.drawZones(); renderChips();
      Panel.back();
    },
    terrainFit: () => App.terrainFit(false),
    resetDemo: async () => {
      const ok = await modal('기본 배치로 되돌리기', '시험 구역을 기본 배치로 다시 만듭니다. 직접 그리거나 가져온 구역은 그대로 둡니다.', [{ label: '되돌리기', cls: 'primary', value: true }, { label: '취소', value: false }]);
      if (!ok || !S.center) return;
      const keep = S.zones.filter((z) => z.source === 'user' || z.source === 'import');
      S.zones = Zones.demo(S.center).concat(keep); saveZones(); MV.drawZones(); Panel.render();
    },
    exportZones: () => download(`navi-zones-${stamp()}.geojson`, JSON.stringify(Zones.toGeoJSON(S.zones), null, 1), 'application/geo+json'),
    exportAll: () => download(`navi-backup-${stamp()}.json`, JSON.stringify({ app: 'NAVI', version: NaviCore.NAVI_VERSION, zones: Zones.toGeoJSON(S.zones), reports: S.reports, settings: Object.assign({}, S.settings, { stadiaKey: '' }), center: S.center, centerLabel: S.centerLabel }, null, 1), 'application/json'),
    clearAll: async () => {
      const ok = await modal('모두 지우기', '구역, 제보, 설정을 이 기기에서 모두 지웁니다. 되돌릴 수 없습니다.', [{ label: '모두 지우기', cls: 'danger', value: true }, { label: '취소', value: false }]);
      if (!ok) return;
      try { Object.keys(localStorage).filter((k) => k.startsWith(KEY)).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* ignore */ }
      try { indexedDB.deleteDatabase('navi'); } catch (e) { /* ignore */ }
      location.reload();
    },
  };

  /* ---------------------------------------------------------- Location -- */
  const Loc = {
    firstFixFly: false,
    start(fly) {
      if (!('geolocation' in navigator)) { S.posErr = '이 브라우저는 위치 기능을 지원하지 않습니다.'; renderChips(); return; }
      if (fly) this.firstFixFly = true;
      if (S.watchId != null) return;
      $('#btnLocate').classList.remove('pulse');
      S.watchId = navigator.geolocation.watchPosition((p) => this.onPos(p), (e) => this.onErr(e), { enableHighAccuracy: true, maximumAge: 1500, timeout: 30000 });
    },
    locateBtn() {
      if (S.pos && !S.pos.sim) { MV.flyTo([S.pos.lon, S.pos.lat], Math.max(MV.map.getZoom(), 16)); S.followUntil = 0; return; }
      if (S.watchId != null && S.posErr) { navigator.geolocation.clearWatch(S.watchId); S.watchId = null; }
      S.posErr = null; renderChips();
      this.start(true);
      toast('위치를 찾는 중입니다.');
    },
    onPos(p) {
      const c = p.coords;
      S.realPos = { lon: c.longitude, lat: c.latitude, acc: c.accuracy, speed: c.speed, heading: c.heading, t: p.timestamp || Date.now() };
      if (S.mon && S.mon.sim) return;
      S.pos = Object.assign({}, S.realPos);
      S.posErr = null;
      MV.drawPos(); renderChips();
      if (this.firstFixFly) { this.firstFixFly = false; MV.flyTo([S.pos.lon, S.pos.lat], 16); }
      if (S.mon && !S.mon.sim) App.onFix({ lon: S.pos.lon, lat: S.pos.lat, acc: S.pos.acc, speed: c.speed, heading: c.heading, t: Date.now() });
      Panel.refreshIf(S.panel && S.panel.name === 'plan' && S.plan.origin.kind === 'gps' && !S.planning && !this._planRendered ? ['plan'] : []);
      this._planRendered = true;
    },
    onErr(e) {
      const msg = e.code === 1 ? '위치 권한이 꺼져 있습니다. 설정 앱의 개인정보 보호 및 보안에서 위치 서비스와 Safari 웹사이트 권한을 확인해 주세요.' : e.code === 3 ? '위치를 받는 데 시간이 걸리고 있습니다.' : '위치를 확인하지 못했습니다.';
      S.posErr = e.code === 1 ? '위치 권한 꺼짐' : e.code === 3 ? '위치 대기 중' : '위치 확인 실패';
      renderChips();
      if (e.code !== 3) toast(msg, true, 6500);
    },
  };

  window.NAVI = { S, App, MV, Panel, Actions, Loc, Editor, core: NaviCore };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.boot());
  else App.boot();
})();

}
</script>
</body>
</html>
