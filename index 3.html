    reports() {
      const KIND = { alive: '살아 있는 곤충', dead: '사체', swarm: '떼 출현', ant: '개미굴' };
      const now = Date.now();
      const list = S.reports.slice().reverse().map((r) => {
        const z = r.zoneId && S.zones.find((q) => q.id === r.zoneId);
        const zs = r.zoneId ? (z ? (z.kind === 'micro' ? '발밑 주의 지점 유지 중' : z.expires != null ? (now < z.expires ? `임시 구역, ${leftText(z.expires - now)} 남음` : '임시 구역 기한 지남') : '임시 구역 유지 중') : '임시 구역 사라짐') : '';
        const title = r.kind === 'ant' ? '개미굴' : `${r.taxa && r.taxa !== '모름' ? r.taxa + ' ' : r.kind === 'alive' ? '' : '곤충 '}${KIND[r.kind] || r.kind}`;
        return `<div class="card"><div class="row"><div class="grow"><b>${esc(title)}</b>${r.quick ? ' <span class="badge">빠른 제보</span>' : ''}<div class="tiny muted">${esc(Time.ymd(r.t) + ' ' + Time.hm(r.t))}, ${esc(fmtLL(r.ll))}${Number.isFinite(r.acc) ? `, 정확도 ${Math.round(r.acc)}m` : ''}</div>${zs ? `<div class="tiny">${esc(zs)}</div>` : ''}${r.memo ? `<div class="small">${esc(r.memo)}</div>` : ''}</div>
          ${z ? `<button class="btn sm ghost" data-act="zone" data-id="${z.id}" aria-label="구역 보기">${ic('info')}</button>` : ''}<button class="btn sm ghost" data-act="reportView" data-id="${r.id}" aria-label="지도에서 보기">${ic('eye')}</button><button class="btn sm ghost" data-act="reportDel" data-id="${r.id}" aria-label="삭제">${ic('trash')}</button></div></div>`;
      }).join('');
      return {
        title: '내 제보와 임시 구역',
        html: `${list || '<div class="note">아직 제보가 없습니다.</div>'}
          <div class="btns" style="margin-top:12px"><button class="btn sm" data-act="exportReports" data-f="geojson">${ic('download')}GeoJSON</button><button class="btn sm" data-act="exportReports" data-f="csv">${ic('download')}CSV</button></div>
          <p class="tiny muted">내보낸 파일은 연구나 검증에 쓸 수 있습니다. 공개 범위가 비공개인 제보는 공유하기 전에 좌표를 확인해 주세요. 제보를 지우면 연결된 임시 구역도 함께 지워집니다.</p>`,
      };
    },
    editor() {
      const own = S.zones.filter((z) => !isObs(z));
      const list = own.map((z) => `<div class="item">${gradeSvg(zoneKey(z))}<span class="grow"><span class="t">${esc(z.name)}</span><br><span class="s">${{ demo: '기본 시험 구역', terrain: '지형 맞춤 시험 구역', user: '직접 그림', import: '가져옴', report: '제보로 만든 구역' }[z.source] || z.source}, 꼭짓점 ${z.geom.length}개</span></span>
          <button class="btn sm ghost" data-act="zoneView" data-id="${z.id}" aria-label="보기">${ic('eye')}</button><button class="btn sm ghost" data-act="editZone" data-id="${z.id}" aria-label="편집">${ic('edit')}</button></div>`).join('');
      const nObs = S.zones.length - own.length;
      return {
        title: '구역 편집',
        html: `<div class="btns"><button class="btn primary" data-act="drawNew">${ic('poly')}새 구역 그리기</button></div>
          <details class="grpd" style="margin-top:10px"><summary class="grp">근거 템플릿으로 그리기 ${KB.templates.length}개</summary><p class="tiny muted" style="margin:4px 2px 6px">조사한 자료로 시기, 시간, 피해 기전, 권고 행동을 미리 채운 틀입니다. 고른 뒤 지도에 꼭짓점을 찍으면 그 값이 들어간 구역이 됩니다.</p>
            <div class="list">${KB.templates.map((t) => `<div class="item"><span class="cs-dot" style="background:${CASE_COLOR[t.group] || '#00695c'}"></span><span class="grow"><span class="t">${esc(t.name)}</span><br><span class="s">${esc(t.desc)}</span></span><button class="btn sm ghost" data-act="tplOpen" data-id="${t.id}" aria-label="근거 보기">${ic('info')}</button><button class="btn sm" data-act="tplDraw" data-id="${t.id}">그리기</button></div>`).join('')}</div></details>
          <div class="sec" style="margin-top:12px"><h3>시험 지역</h3><div class="card small">${S.center ? `${esc(S.centerLabel || '지정한 지점')} (${fmtLL(S.center)})` : '아직 정하지 않음'}</div>
            ${S.settings.demoOn ? `<div class="btns" style="margin-top:8px"><button class="btn sm" data-act="terrainFit">${ic('leaf')}주변 지형에 맞춰 다시 만들기</button><button class="btn sm" data-act="resetDemo">${ic('refresh')}기본 배치로 되돌리기</button></div>
            ${(S.terrainReport || store.get('terrainReport', [])).length ? `<p class="small" style="margin:8px 0 0">지형 맞춤 결과: ${esc((S.terrainReport || store.get('terrainReport', [])).join(', '))}</p>` : ''}
            <p class="tiny muted">지형 맞춤은 배경 지도의 하천, 녹지, 도로 자료로 시험 구역 위치를 다시 잡습니다. 시험 지역을 바꾸려면 지도를 길게 눌러 "여기를 시험 지역 중심으로"를 고르세요.</p>` : '<p class="tiny muted" style="margin:8px 2px 0">시험용 가상 구역은 꺼져 있습니다. 이 지점은 실제 관찰 기록을 받는 중심으로만 씁니다. 동작을 시험하려면 설정에서 "시험용 가상 구역 쓰기"를 켜세요.</p>'}</div>
          <div class="sec"><h3>구역 ${own.length}곳</h3><div class="list">${list}</div>${nObs ? `<p class="tiny muted">실제 관찰 기록 구역 ${nObs}곳은 자료를 받을 때마다 자동으로 다시 만들기 때문에 여기서 편집하지 않습니다.</p>` : ''}</div>
          <div class="sec"><h3>파일</h3><div class="btns"><button class="btn sm" data-act="exportZones">${ic('download')}GeoJSON 내보내기</button><label class="btn sm">${ic('upload')}가져오기<input type="file" accept=".geojson,.json,application/geo+json,application/json" id="zoneImport" class="sr"></label></div>

        after() { $('#zoneImport').onchange = (e) => App.importZones(e.target.files && e.target.files[0]); },
      };
    },
    zoneForm(id) {
      const z = S.zones.find((q) => q.id === id);
      if (!z) return { title: '구역 편집', html: '<div class="note">구역을 찾을 수 없습니다.</div>' };
      const opt = (v, l, cur) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${l}</option>`;
      const chk = (name, v, l, arr) => `<label class="check" style="padding:4px 0"><input type="checkbox" data-zf="${name}" value="${v}" ${arr.includes(v) ? 'checked' : ''}>${l}</label>`;
      const winRows = (key, arr, kind) => arr.map((w, i) => `<div class="row" style="margin-bottom:6px"><input type="text" data-win="${key}" data-i="${i}" data-e="from" value="${esc(w.from)}" style="width:44%;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface)"><span>~</span><input type="text" data-win="${key}" data-i="${i}" data-e="to" value="${esc(w.to)}" style="width:44%;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface)"><button class="btn sm ghost" data-act="winDel" data-k="${key}" data-i="${i}" aria-label="삭제">${ic('trash')}</button></div>`).join('') + `<button class="btn sm ghost" data-act="winAdd" data-k="${key}" data-kind="${kind}">${ic('plus')}추가</button>`;
      const evList = () => {
        const q = (S.evQ || '').trim().toLowerCase();
        const sel = z.evidence.filter((k) => refOf(k));
        const rest = LIB_KEYS.filter((k) => !sel.includes(k) && (!q || (REFS[k].c + ' ' + REFS[k].s).toLowerCase().includes(q))).slice(0, q ? 60 : 25);
        const row = (k, on) => `<label class="check" style="padding:3px 0;align-items:flex-start"><input type="checkbox" data-zf="evidence" value="${k}" ${on ? 'checked' : ''}><span class="small">${esc(refOf(k).c)}<span class="tiny muted" style="display:block">${esc(refOf(k).s)}</span></span></label>`;
        return sel.map((k) => row(k, true)).join('') + (sel.length && rest.length ? '<hr>' : '') + rest.map((k) => row(k, false)).join('') + (!q ? `<p class="tiny muted">위 검색창에 낱말을 넣으면 자료 ${LIB_KEYS.length}건 가운데서 찾습니다.</p>` : '');
      };
      const refOpts = `<input type="search" id="evQ" placeholder="자료 찾기 (예: 하루살이, 반딧불이, 속도)" value="${esc(S.evQ || '')}" autocomplete="off" style="width:100%;margin:6px 0;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink)"><div id="evList">${evList()}</div>`;
      return {
        title: '구역 편집',
        html: `<div class="field"><label>근거 템플릿 적용</label><select id="tplSel"><option value="">고르면 시기, 시간, 기전, 권고 행동을 채웁니다</option>${KB.templates.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>
          <div class="field"><label>이름</label><input type="text" data-zf="name" value="${esc(z.name)}"></div>
          <div class="row" style="gap:10px"><div class="field grow"><label>종류</label><select data-zf="kind">${opt('eco', '생태 구역', z.kind)}${opt('legal', '법적 통제', z.kind)}${opt('nuisance', '불편 정보', z.kind)}${opt('micro', '발밑 주의 지점', z.kind)}</select></div>
          ${z.kind === 'eco' ? `<div class="field grow"><label>생태 등급</label><select data-zf="grade">${['E1', 'E2', 'E3', 'E4', 'U'].map((g) => opt(g, g + ' ' + GRADE[g].label, z.grade)).join('')}</select></div>` : ''}</div>
          <div class="row" style="gap:10px"><div class="field grow"><label>법적 상태</label><select data-zf="legal">${['L0', 'L1', 'L2'].map((g) => opt(g, g + ' ' + LEGAL[g].label, z.legal)).join('')}</select></div>
          <div class="field grow"><label>자료 신뢰도</label><select data-zf="q">${Object.keys(QF).map((q) => opt(q, q + ' ' + QF[q].label, z.q)).join('')}</select></div></div>
          ${z.legal !== 'L2' ? `<div class="field"><label>법적 근거</label><input type="text" data-zf="legalBasis" value="${esc(z.legalBasis)}"></div>` : ''}
          ${z.legal === 'L1' ? `<div class="field"><span class="lbl">통제 시기 (MM-DD)</span>${winRows('legalSeason', z.legalSeason, 'season')}</div><div class="field"><span class="lbl">통제 시간</span>${winRows('legalDaily', z.legalDaily, 'daily')}</div>` : ''}
          <div class="field"><span class="lbl">적용 수단</span><div class="row">${chk('modes', 'walk', '도보', z.modes)}${chk('modes', 'car', '자동차', z.modes)}</div></div>
          ${z.kind === 'eco' ? `<div class="field"><span class="lbl">피해 기전</span><div class="row wrap">${Object.keys(MECH).map((m) => chk('mechanisms', m, MECH[m].label, z.mechanisms)).join('')}</div></div>` : ''}
          <div class="field"><span class="lbl">활동 시기 (MM-DD, 비우면 연중)</span>${winRows('season', z.season, 'season')}</div>
          <div class="field"><span class="lbl">활동 시간 (예: SUNSET+00:00, SUNRISE-01:00, 20:00. 비우면 하루 종일)</span>${winRows('daily', z.daily, 'daily')}</div>
          <div class="field"><label>대상 곤충 무리</label><input type="text" data-zf="taxa" value="${esc(z.taxa)}"></div>
          <div class="field"><label>권고 행동 (쉼표로 구분)</label><input type="text" data-zf="actions" value="${esc(z.actions.join(', '))}"></div>

  const GROUP_ORDER = LIB.groups.map((g) => g.id);

  const LIB_KEYS = Object.keys(REFS).sort((a, b) => {
    const ra = REFS[a], rb = REFS[b], ca = LIB.cats[ra.cat] || {}, cb = LIB.cats[rb.cat] || {};
    const g = GROUP_ORDER.indexOf(ca.g) - GROUP_ORDER.indexOf(cb.g);
    if (g) return g;
    const ck = Object.keys(LIB.cats);
    const c = ck.indexOf(ra.cat) - ck.indexOf(rb.cat);
    if (c) return c;
    return (rb.y || 0) - (ra.y || 0);
  });
  const MD_DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  const doy = (md) => { const [m, d] = md.split('-').map(Number); let n = 0; for (let i = 0; i < m - 1; i++) n += MD_DAYS[i]; return n + Math.min(d, MD_DAYS[m - 1]) - 1; };
  const mdText = (md) => { if (!md) return '-'; const [m, d] = md.split('-').map(Number); return `${m}월 ${d}일`; };
  const inSpan = (md, s) => { const x = doy(md), a = doy(s.from), b = doy(s.to); return a <= b ? x >= a && x <= b : x >= a || x <= b; };
  const refLinks = (keys) => keys.map(refKey).filter(Boolean).map((k) => `<a class="ref-chip" href="${esc(safeUrl(REFS[k].u))}" target="_blank" rel="noopener" title="${esc(REFS[k].c)}">${esc(shortCite(REFS[k].c))}</a>`).join('');
  /* "Blomqvist S, Smith HG(2026)" -> "Blomqvist 외 2026", "경향신문 오경민(2025년 6월 6일)" -> "경향신문 오경민 2025". */
  function shortCite(c) {
    const s = String(c || '');
    const y = (s.match(/\((?:[^)]*?)((?:19|20)\d{2})/) || [])[1];
    let a = s.split(/[(.]/)[0].trim();
    const multi = /,/.test(a) || /\s외$/.test(a);
    a = a.split(',')[0].replace(/\s외$/, '').trim();
    if (/^[A-Z][A-Za-z'-]+ [A-Z]{1,3}$/.test(a)) a = a.split(' ')[0];
    if (a.length > 22) a = a.slice(0, 21) + '…';
    return y ? `${a}${multi ? ' 외' : ''} ${y}` : a;
  }

  const Cases = {
    pointsOf(region) { return KB.cases.filter((c) => region === 'all' || c.region === region).flatMap((c) => c.pts.map((p) => p.ll)); },
    showLayer() { if (!S.layers.cases) { S.layers.cases = true; store.set('layers', S.layers); MV.drawCases(); } },
    fly(id, i) {
      const c = CASE[id];
      if (!c || !c.pts.length) return;
      this.showLayer();
      if (i == null && c.pts.length > 1) { MV.fit(c.pts.map((p) => p.ll), 11); return; }
      const p = c.pts[i || 0];
      MV.map.flyTo({ center: p.ll, zoom: PREC_ZOOM[p.prec] || 13, padding: MV.camPad(), duration: 1100, essential: true });
    },
    fitRegion(region) {
      const pts = this.pointsOf(region);
      if (!pts.length) return;
      this.showLayer();
      MV.fit(pts, 12);
    },
    zoneFields(t) { return JSON.parse(JSON.stringify(t.zone)); },
    canZone(c, i = 0) { const p = c && c.pts[i]; return !!(p && p.prec !== 'approx'); },
    /* A practice zone: a circle of the case radius at the case point, filled from its evidence template. */
    makeZone(id, i = 0) {
      const c = CASE[id];
      if (!c || !c.pts.length) return null;
      const p = c.pts[i] || c.pts[0];
      if (p.prec === 'approx') { toast('이 사례의 위치는 대략적인 대표 좌표라 구역을 만들지 않습니다.', true); return null; }
      const t = TPL[c.tpl] || null, r = c.r || (t && t.r) || 300;
      const base = t ? this.zoneFields(t) : { kind: 'eco', grade: 'E3', q: 'Q3' };
      const ev = [...new Set(c.refs.concat(t ? t.evidence : []).map(refKey).filter(Boolean))];
      const note = `사례 "${c.title}"의 위치(${p.label}) 주변 반경 ${r}m 연습 구역입니다. 실제 서식지나 통제 구역의 경계가 아니므로 꼭짓점 편집으로 고쳐 쓰세요.` + (t ? ` 시기와 시간, 권고 행동은 근거 템플릿 "${t.name}" 값입니다.` : '');
      const z = Zones.normalize(Object.assign(base, { name: c.short + ' 사례 구역', source: 'user', verification: 'unverified', updated: Time.iso(Date.now()), evidence: ev, geom: Geo.circle(p.ll, r, 36), note }));
      S.zones.push(z); saveZones(); MV.drawZones(); renderChips();
      MV.fit(z.geom, 16);
      Panel.open('zoneForm', z.id, { push: true });
      toast('사례 위치에 연습 구역을 만들었습니다. 고친 뒤 저장하세요.');
      return z;
    },
    applyTpl(z, id) {
      const t = TPL[id];
      if (!z || !t) return;
      Object.assign(z, this.zoneFields(t));
      z.evidence = [...new Set((z.evidence || []).concat(t.evidence).map((k) => refKey(k) || k))];
      if (!z.name || z.name === '새 구역') z.name = t.name;
      Object.assign(z, Zones.normalize(z));
    },
    /* Calendar rows active on a month-day. */
    activeRows(md) { return KB.calendar.filter((r) => r.spans.some((s) => s.strong && inSpan(md, s))); },
  };

  const libMatches = () => {
    const H = S.hub, q = H.q.trim().toLowerCase();
    return LIB_KEYS.filter((k) => {
      const r = REFS[k], cat = LIB.cats[r.cat] || {};
      if (H.grp !== 'all' && cat.g !== H.grp) return false;
      if (!q) return true;
      return (r.c + ' ' + r.s + ' ' + (cat.label || '') + ' ' + k).toLowerCase().includes(q);
    });
  };
  const libItem = (k) => {
    const r = REFS[k], cited = CITED[k] || [];
    const cs = cited.filter((x) => x.t === 'case').slice(0, 3).map((x) => `<button class="mini" data-act="caseOpen" data-id="${x.id}">${csDot(CASE[x.id].group, 9)}${esc(CASE[x.id].short)}</button>`).join('');
    const nt = cited.filter((x) => x.t === 'tpl').length;
    return `<div class="lib-it"><div class="c">${esc(r.c)}</div><div class="s">${esc(r.s)}</div>
      <div class="lib-meta"><span class="tag">${esc(catLabel(r.cat))}</span><a href="${esc(safeUrl(r.u))}" target="_blank" rel="noopener">${icS('external', 13)}원문</a>${cs}${nt ? `<span class="tiny muted">템플릿 ${nt}개에 쓰임</span>` : ''}</div></div>`;
  };
  const libListHtml = () => {
    const H = S.hub, keys = libMatches(), shown = keys.slice(0, H.n);
    return `<div class="tiny muted" style="margin:2px 2px 8px">${keys.length}건${H.q ? ` ("${esc(H.q)}")` : ''}</div>${shown.map(libItem).join('') || '<div class="note">찾는 자료가 없습니다.</div>'}
      ${keys.length > shown.length ? `<button class="btn sm block" data-act="libMore">${keys.length - shown.length}건 더 보기</button>` : ''}`;
  };

  function hubCases() {
    const H = S.hub, list = KB.cases.filter((c) => H.region === 'all' || c.region === H.region);
    const nPts = KB.cases.reduce((a, c) => a + c.pts.length, 0);
    const cnt = (r) => KB.cases.filter((c) => r === 'all' || c.region === r).length;
    const order = ['kr', 'world', 'ref'];
    const groups = order.filter((r) => H.region === 'all' || r === H.region).map((r) => {
      const items = list.filter((c) => c.region === r);
      if (!items.length) return '';
      return `<div class="grp">${REGION_LABEL[r]} ${items.length}건</div><div class="list">${items.map((c) => `<button class="item" data-act="caseOpen" data-id="${c.id}">${csDot(c.group, 14)}<span class="grow"><span class="t">${esc(c.title)}</span><br><span class="s">${esc(c.period)} · ${c.pts.length ? `지도 ${c.pts.length}곳` : '지도 위치 없음'} · ${esc(grpLabel(c.group))}</span></span></button>`).join('')}</div>`;
    }).join('');
    return {
      html: `<p class="small" style="margin:2px 2px 10px">자료 조사에서 모은 국내외 사례 ${KB.cases.length}건입니다. 지도의 사례 표시는 정보일 뿐 경로를 바꾸지 않습니다. 사례를 열어 위치와 근거를 확인하고, 원하면 그 자리에 연습용 구역을 만들 수 있습니다.</p>
        <label class="check"><input type="checkbox" data-layer="cases" ${S.layers.cases ? 'checked' : ''}>${csDot('mayfly', 14)}<span class="grow">지도에 사례 표시 <span class="muted small">(확인한 지점 ${nPts}곳)</span></span></label>
        ${chipsSel('hubRegion', Object.keys(REGION_LABEL).map((k) => [k, `${REGION_LABEL[k]} ${cnt(k)}`]), H.region)}
        <div class="btns" style="margin:8px 0 4px"><button class="btn sm" data-act="caseFit" data-v="kr">${icS('pin')}국내 사례 보기</button><button class="btn sm ghost" data-act="caseFit" data-v="all">${icS('globe')}세계 지도로</button></div>
        ${groups}
        <p class="tiny muted" style="margin-top:10px">지점의 정확도는 사례마다 다릅니다. '대략'은 도시나 항만, 섬의 대표 좌표이며, 좌표를 확인하지 못한 사례는 목록에만 둡니다.</p>`,
    };
  }

  function hubCal() {
    const H = S.hub, t = nowT(), k = Time.kst(t), md = String(k.m).padStart(2, '0') + '-' + String(k.d).padStart(2, '0');
    const todayPct = (doy(md) + 0.5) / 365 * 100;
    const months = Array.from({ length: 12 }, (_, i) => `<span>${i + 1}</span>`).join('');
    const bar = (s, g) => {
      const parts = doy(s.from) <= doy(s.to) ? [[doy(s.from), doy(s.to)]] : [[doy(s.from), 364], [0, doy(s.to)]];
      return parts.map(([a, b]) => `<i class="${s.strong ? 'st' : 'lt'}" style="left:${(a / 365 * 100).toFixed(2)}%;width:${Math.max(0.6, (b - a + 1) / 365 * 100).toFixed(2)}%;background:${CASE_COLOR[g] || '#00695c'}"></i>`).join('');
    };
    const row = (r, key) => `<button class="cal-row${H.cal === key ? ' open' : ''}" data-act="calRow" data-k="${key}"><span class="cal-name">${csDot(r.group, 10)}${esc(r.name)}</span><span class="cal-track">${r.spans.map((s) => bar(s, r.group)).join('')}<b class="cal-now" style="left:${todayPct.toFixed(2)}%"></b></span></button>
      ${H.cal === key ? `<div class="cal-note"><div>${esc(r.note)}</div><div class="refs">${refLinks(r.refs)}</div></div>` : ''}`;
    const act = Cases.activeRows(md);
    const kma = KB.kma, st = (kma && kma.rows.find((x) => x[0] === H.station)) || (kma && kma.rows[0]);
    return {
      html: `<div class="card" style="margin-bottom:10px"><b>${esc(Time.md(t))}${S.timeMode === 'custom' ? ' (지정 시각)' : ''}</b> 기준 활동 시기: ${act.length ? act.map((r) => `<span class="chip-s">${csDot(r.group, 9)}${esc(r.name)}</span>`).join(' ') : '<span class="muted">달력의 국내 무리 가운데 없음</span>'}</div>
        <div class="cal"><div class="cal-head"><span class="cal-name"></span><span class="cal-months">${months}</span></div>
          ${KB.calendar.map((r, i) => row(r, 'k' + i)).join('')}
          <div class="grp" style="margin-top:12px">해외와 참고</div>
          ${KB.calendarWorld.map((r, i) => row(r, 'w' + i)).join('')}</div>
        <p class="tiny muted" style="margin:6px 2px 0">진한 막대는 근거가 된 시기, 옅은 막대는 넓게 잡은 범위나 다른 보고입니다. 세로선은 오늘입니다. 줄을 누르면 근거를 봅니다.</p>
        ${kma ? `<div class="sec" style="margin-top:14px"><h3>지역별 첫 관측 평년값 (${esc(kma.period)})</h3>
          <div class="field"><select id="kmaSel">${kma.rows.map((r) => `<option ${r[0] === st[0] ? 'selected' : ''}>${esc(r[0])}</option>`).join('')}</select></div>
          <dl class="kv">${kma.cols.map((c, i) => `<dt>${esc(c)}</dt><dd>${st[i + 1] ? mdText(st[i + 1]) : '평년값 없음'}</dd>`).join('')}</dl>
          <p class="tiny muted">기상청 계절관측입니다. 나비를 처음 보는 날은 대구 3월 21일에서 인천 4월 14일까지 3주 넘게 차이 나고, 대관령은 5월 15일입니다. 1991~2020년 평년에는 여름이 118일로 4일 길어졌으므로, 실제 시기는 그해 관측과 제보로 옮겨야 합니다. ${refLinks([kma.ref, 'kkmanormals'])}</p></div>` : ''}`,
      after() { const s = $('#kmaSel'); if (s) s.onchange = () => { S.hub.station = s.value; Panel.render(); }; },
    };
  }

  function hubNums() {
    return {
      html: `<p class="small" style="margin:2px 2px 10px">해외 연구에서 가져온 위험 판단 수치입니다. 특정 종과 나라에서 나온 값이라 국내에 그대로 맞는다고 보지 않고, NAVI의 초기값 후보로만 씁니다.</p>
        <div class="sec"><h3>위험 판단 수치</h3>${KB.thresh.map((r) => `<div class="num-card"><div class="row"><b class="grow">${esc(r.item)}</b></div><div class="v">${esc(r.val)}</div><div class="tiny"><span class="muted">앱에서:</span> ${esc(r.use)}</div><div class="tiny"><span class="muted">주의:</span> ${esc(r.care)}</div><div class="refs">${refLinks(r.refs)}</div></div>`).join('')}</div>
        <div class="sec"><h3>비행과 활동 조건</h3>${KB.flight.map((r) => `<div class="num-card"><b>${esc(r.who)}</b> <span class="tiny muted">${esc(r.cond)}</span><div class="v">${esc(r.val)}</div><div class="refs">${refLinks(r.refs)}</div></div>`).join('')}
          <div class="note">${esc(KB.flightRule)}</div></div>
        <div class="sec"><h3>이동 방식별 피해 유형</h3>${KB.harm.map((r) => `<div class="num-card"><b>${esc(r.mode)}</b><div class="v">${esc(r.harm)}</div><div class="tiny"><span class="muted">장소:</span> ${esc(r.where)}</div><div class="tiny"><span class="muted">시기:</span> ${esc(r.when)}</div><div class="refs">${refLinks(r.refs)}</div></div>`).join('')}</div>
        ${KB.design ? `<details class="sec grpd"><summary class="grp">위험 점수 설계 제안 (자료 보고서, 검증 전)</summary>

          ${KB.design.rows.map((r) => `<div class="num-card"><b>${esc(r.item)}</b> <span class="tiny muted">${esc(r.data)}</span><div class="v">${esc(r.val)}</div><div class="refs">${refLinks(r.refs)}</div></div>`).join('')}</details>` : ''}
        ${KB.update ? `<details class="sec grpd"><summary class="grp">자료 갱신 주기 제안</summary>${KB.update.map((r) => `<div class="num-card"><b>${esc(r[0])}</b><div class="tiny"><span class="muted">원자료:</span> ${esc(r[1])}</div><div class="tiny"><span class="muted">앱 반영(제안):</span> ${esc(r[2])}</div><div class="refs">${refLinks([r[3]])}</div></div>`).join('')}</details>` : ''}
        ${KB.license ? `<details class="sec grpd"><summary class="grp">공공데이터 이용 조건</summary>${KB.license.map((r) => `<div class="num-card"><b>${esc(r[0])}</b><div class="v">${esc(r[1])}</div><div class="refs">${refLinks([r[2]])}</div></div>`).join('')}<p class="tiny muted">공공누리 4유형 자료는 상업적 이용과 변경이 금지되므로 유료 앱이나 가공 표시에 쓰기 어렵습니다.</p></details>` : ''}`,
    };
  }

  Object.assign(Views, {
    hub() {
      const H = S.hub;
      const tabs = [['cases', '사례', 'pin'], ['cal', '활동 달력', 'cal'], ['nums', '기준 수치', 'chart'], ['lib', '자료실', 'book']];

          <button class="btn sm ghost" data-act="caseFly" data-id="${c.id}" data-i="${i}" aria-label="지도에서 보기">${icS('eye')}</button>${Cases.canZone(c, i) && c.pts.length > 1 ? `<button class="btn sm ghost" data-act="caseZone" data-id="${c.id}" data-i="${i}" aria-label="이 지점에 구역 만들기">${icS('poly')}</button>` : ''}</div>`).join('');

          <div class="small muted" style="margin-bottom:10px">${esc(c.place)}${c.taxa ? ' · ' + esc(c.taxa) : ''}</div>
          ${c.what.length ? `<div class="sec"><h3>무슨 일이 있었나</h3>${ul(c.what)}</div>` : ''}
          ${c.did.length ? `<div class="sec"><h3>한 일</h3>${ul(c.did)}</div>` : ''}
          ${c.result.length ? `<div class="sec"><h3>결과와 한계</h3>${ul(c.result)}</div>` : ''}
          <div class="card navi-card"><b>${icS('leaf')} NAVI에 주는 시사점</b><div class="small" style="margin-top:4px">${esc(c.navi)}</div></div>
          <div class="sec" style="margin-top:12px"><h3>위치</h3>${c.pts.length ? pts : '<div class="note">확인한 좌표가 없어 지도에 표시하지 않습니다.</div>'}</div>
          ${zoneable && c.pts.length === 1 ? `<button class="btn primary block" style="margin-top:4px" data-act="caseZone" data-id="${c.id}" data-i="0">${ic('poly')}이 사례로 구역 만들기</button>` : ''}
          <div class="btns" style="margin-top:8px">${c.pts.length ? `<button class="btn" data-act="caseFly" data-id="${c.id}">${ic('eye')}지도에서 보기</button>` : ''}
            ${t ? `<button class="btn ghost" data-act="tplOpen" data-id="${t.id}">${ic('leaf')}근거 템플릿</button>` : ''}</div>

            ${z.actions.length ? `<dt>권고 행동</dt><dd>${z.actions.map(esc).join(', ')}</dd>` : ''}

          <div class="btns"><button class="btn primary" data-act="tplDraw" data-id="${t.id}">${ic('poly')}이 템플릿으로 새 구역 그리기</button></div>
          ${used.length ? `<div class="sec" style="margin-top:12px"><h3>이 템플릿을 쓰는 사례</h3><div class="list">${used.map((c) => `<button class="item" data-act="caseOpen" data-id="${c.id}">${csDot(c.group, 12)}<span class="grow t">${esc(c.title)}</span></button>`).join('')}</div></div>` : ''}
          <div class="sec" style="margin-top:12px"><h3>근거 자료 ${t.evidence.length}건</h3><ul class="evid" style="padding-left:18px">${t.evidence.map(refItem).join('')}</ul></div>`,

  /* ---------------------------------------------------------- Editor -- */
  const EditBar = {
    render() {
      const el = $('#editBar'), e = S.edit;
      if (!e) { el.classList.add('hidden'); return; }
      el.classList.remove('hidden');
      if (e.mode === 'draw') {
        el.innerHTML = `<span class="msg">${e.tpl ? esc(TPL[e.tpl].name) + ': ' : ''}지도를 눌러 꼭짓점을 찍으세요 (${e.verts.length}개)</span><button class="btn sm" data-e="undo" ${e.verts.length ? '' : 'disabled'}>되돌리기</button><button class="btn sm primary" data-e="done" ${e.verts.length >= 3 ? '' : 'disabled'}>완료</button><button class="btn sm ghost" data-e="cancel">취소</button>`;
      } else {
        el.innerHTML = `<span class="msg">점을 끌어 옮기고, 빈 곳을 누르면 점이 추가됩니다</span><button class="btn sm" data-e="delv" ${e.selV != null && e.verts.length > 3 ? '' : 'disabled'}>선택한 점 삭제</button><button class="btn sm primary" data-e="done">완료</button><button class="btn sm ghost" data-e="cancel">취소</button>`;
      }
      el.onclick = (ev) => { const b = ev.target.closest('[data-e]'); if (b) Editor.cmd(b.dataset.e); };
    },
  };
  const Editor = {
    startDraw(zoneId = null, tpl = null) { S.edit = { mode: 'draw', verts: [], zoneId, tpl: tpl && TPL[tpl] ? tpl : null }; Panel.hideTemporarily(!WIDE()); EditBar.render(); MV.drawEdit(); if (S.edit.tpl) toast(`'${TPL[tpl].name}' 템플릿으로 그립니다. 지도에 꼭짓점을 찍으세요.`); },
    startVertex(zoneId) {
      const z = S.zones.find((q) => q.id === zoneId);
      if (!z) return;
      if (z.sensitive) toast('민감 구역은 실제 경계를 편집하고, 지도에는 격자로 표시됩니다.');
      S.edit = { mode: 'vertex', verts: z.geom.map((p) => p.slice()), zoneId, selV: null };
      MV.fit(z.geom, 17);
      EditBar.render(); MV.drawEdit();
    },
    mapClick(ll, pt) {
      const e = S.edit;
      if (e.mode === 'draw') { e.verts.push(ll); }
      else {
        const hit = MV.map.queryRenderedFeatures([[pt.x - 8, pt.y - 8], [pt.x + 8, pt.y + 8]], { layers: ['navi-editv'] });
        if (hit.length) { e.selV = hit[0].properties.i; }
        else {
          const Pp = Geo.proj(ll), xy = e.verts.map(Pp.fwd);
          let best = 0, bd = Infinity;
          for (let i = 0; i < xy.length; i++) { const r = Geo.segProj([0, 0], xy[i], xy[(i + 1) % xy.length]); if (r.d < bd) { bd = r.d; best = i; } }
          e.verts.splice(best + 1, 0, ll); e.selV = best + 1;
        }
      }
      EditBar.render(); MV.drawEdit();
    },
    cmd(c) {
      const e = S.edit;
      if (!e) return;
      if (c === 'undo') e.verts.pop();
      if (c === 'delv' && e.selV != null && e.verts.length > 3) { e.verts.splice(e.selV, 1); e.selV = null; }
      if (c === 'cancel') { S.edit = null; Panel.hideTemporarily(false); }
      if (c === 'done') {
        if (e.verts.length < 3) return;
        let z = e.zoneId && S.zones.find((q) => q.id === e.zoneId);
        if (z) { z.geom = e.verts; z.updated = Time.iso(Date.now()); if (isDemo(z)) z.source = 'user'; }
        else {
          z = Zones.normalize({ name: '새 구역', grade: 'E3', q: 'Q4', verification: 'unverified', source: 'user', updated: Time.iso(Date.now()), geom: e.verts });
          if (e.tpl) Cases.applyTpl(z, e.tpl);
          S.zones.push(z);
        }
        saveZones(); S.edit = null; Panel.hideTemporarily(false);
        MV.drawZones(); Panel.open('zoneForm', z.id, { push: true });
        toast('구역 모양을 저장했습니다.');
      }
      EditBar.render(); MV.drawEdit();
    },
  };

  /* ------------------------------------------------- Guidance screen -- */
  /* Car navigation style: turn card, zone card and trip summary sit beside the map
     (left column on tablets and wide screens, top card + bottom bar on phones). */
  const TURN_PATH = {
    straight: '<path d="M32 56V12"/><path d="M18 26l14-14 14 14"/>',
    right: '<path d="M22 56V34a10 10 0 0 1 10-10h18"/><path d="M40 13l11 11-11 11"/>',
    left: '<path d="M42 56V34a10 10 0 0 0-10-10H14"/><path d="M24 13L13 24l11 11"/>',
    slightR: '<path d="M24 56V38l18-18"/><path d="M30 18h14v14"/>',
    slightL: '<path d="M40 56V38L22 20"/><path d="M34 18H20v14"/>',
    sharpR: '<path d="M20 56V22a8 8 0 0 1 14-5l14 21"/><path d="M50 26v13H37"/>',
    sharpL: '<path d="M44 56V22a8 8 0 0 0-14-5L16 38"/><path d="M14 26v13h13"/>',
    uL: '<path d="M44 56V26a12 12 0 0 0-24 0v18"/><path d="M11 36l9 10 9-10"/>',
    uR: '<path d="M20 56V26a12 12 0 0 1 24 0v18"/><path d="M35 36l9 10 9-10"/>',
    round: '<circle cx="32" cy="30" r="10"/><path d="M32 56V40"/><path d="M39 23l8-9"/><path d="M38 13h10v10"/>',
    dest: '<path d="M22 56V10"/><path d="M22 12h22l-6 8 6 8H22"/>',
    reroute: '<path d="M48 30a16 16 0 1 1-5-11.6"/><path d="M46 8v12H34"/>',
  };
  const TURN_OF = (t) => ({ 2: 'slightR', 3: 'slightL', 4: 'dest', 5: 'dest', 6: 'dest', 9: 'slightR', 10: 'right', 11: 'sharpR', 12: 'uR', 13: 'uL', 14: 'sharpL', 15: 'left', 16: 'slightL', 18: 'slightR', 19: 'slightL', 20: 'slightR', 21: 'slightL', 23: 'slightR', 24: 'slightL', 26: 'round', 27: 'round', 37: 'slightR', 38: 'slightL' }[t] || 'straight');
  const turnSvg = (k, s = 0) => `<svg viewBox="0 0 64 64"${s ? ` width="${s}" height="${s}"` : ''} fill="none" stroke="currentColor" stroke-width="${s && s < 30 ? 7 : 6}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${TURN_PATH[k] || TURN_PATH.straight}</svg>`;
  const navDist = (m) => {
    if (!Number.isFinite(m)) return '-';
    if (m < 1000) return `${m < 100 ? Math.max(5, Math.round(m / 5) * 5) : Math.round(m / 10) * 10}<small>m</small>`;
    return `${(m / 1000).toFixed(m < 10000 ? 1 : 0)}<small>km</small>`;
  };
  const secText = (s) => (s >= 90 ? `약 ${Math.round(s / 60)}분 뒤` : s >= 20 ? `약 ${Math.round(s / 10) * 10}초 뒤` : '곧');
  const SCEN = { normal: '정상 주행', deviate: '이탈 시험', poor: '정확도 나쁨', stopgo: '신호 대기(정차)' };
  const Nav = {
    built: false, ecoAlert: null, ecoUntil: 0, msgTimer: null,
    build() {
      if (this.built) return;
      $('#navStat').innerHTML = `<div class="spd"><b id="nvSpd">-</b><small>km/h</small></div>
        <div class="kv2"><span>경로 이탈</span><b id="nvXte">-</b></div>
        <div class="kv2"><span>위치 정확도</span><b id="nvAcc">-</b></div>
        <div class="kv2"><span>안내 모드</span><b id="nvLv">-</b></div>`;
      $('#navFoot').innerHTML = `<div class="nav-remain"><div><span>남은 거리</span><b id="nvDist">-</b></div><div><span>남은 시간</span><b id="nvTime">-</b></div><div><span>도착 예정</span><b id="nvEta">-</b></div></div>
        <div class="nav-lock hidden" id="nvLock">${icS('lock', 16)}<span>주행 중에는 조작을 잠급니다. 정차하면 풀립니다.</span></div>
        <div class="nav-btns"><button class="btn" data-n="quick" title="빠른 제보">${icS('swarm', 20)}<span>제보</span></button><button class="btn" data-n="opts" title="안내 설정">${icS('settings', 20)}<span>설정</span></button><button class="btn" data-n="center" title="현재 위치로">${icS('target', 20)}<span>위치</span></button><button class="btn danger" data-n="stop">${icS('stop', 20)}<span>종료</span></button></div>
        <div class="nav-sim hidden" id="nvSim"></div>
        <div class="nav-note" id="nvNote"></div>`;
      $('#nav').addEventListener('click', (e) => { const b = e.target.closest('[data-n]'); if (b) Nav.cmd(b.dataset.n, b); });
      this.built = true;
    },
    show(on) {
      this.build();
      document.body.classList.toggle('monitoring', on);
      $('#nav').classList.toggle('hidden', !on);
      if (!on) { $('#navEco').classList.add('hidden'); $('#navMsg').classList.add('hidden'); this.ecoAlert = null; }
      $('#nvLock').classList.toggle('hidden', !S.locked);
      $('#lockPill').classList.toggle('hidden', !S.locked || on);
      // the attribution was shown when the map opened; fold it so it does not cover the route (still one tap away)
      if (on) document.querySelectorAll('.maplibregl-ctrl-attrib.maplibregl-compact-show').forEach((el) => el.classList.remove('maplibregl-compact-show'));
      this.measure();
    },
    measure() {
      const nb = $('#nav .nav-bottom');
      document.documentElement.style.setProperty('--nav-bottom-h', (S.mon && nb && !NAV_SIDE() ? nb.offsetHeight + 16 : 0) + 'px');
    },
    pad() {
      if (NAV_SIDE()) { const w = $('#nav').offsetWidth || 330; return { top: 70, bottom: 70, left: w + 40, right: 60 }; }
      const top = ($('#nav .nav-top') ? $('#nav .nav-top').offsetHeight : 120) + 30;
      const bot = ($('#nav .nav-bottom') ? $('#nav .nav-bottom').offsetHeight : 150) + 70; // + speed bubble above the bar
      return { top, bottom: bot, left: 30, right: 30 };
    },
    note() {
      const m = S.mon, el = $('#nvNote');
      if (!m || !el) return;
      const wake = m.sim ? '' : Wake.supported ? (Wake.lock ? '화면 꺼짐 방지 켜짐.' : '화면 꺼짐 방지를 켜지 못했습니다.') : '이 브라우저는 화면 꺼짐 방지를 지원하지 않습니다.';
      el.textContent = m.sim ? '모의 항해 중입니다. 실제 위치 대신 경로를 따라 만든 위치를 씁니다.' : '웹 버전은 화면이 켜져 있을 때만 안내합니다. ' + wake;
    },
    simBar() {
      const m = S.mon, el = $('#nvSim');
      if (!m || !m.sim) { el.classList.add('hidden'); return; }
      el.classList.remove('hidden');
      el.innerHTML = `<span class="tiny muted">모의 항해</span><button class="btn sm" data-n="simScen">${SCEN[m.sim.o.scenario]}</button><button class="btn sm" data-n="simSpeed">${m.scale}배속</button><button class="btn sm" data-n="simPause">${m.paused ? '계속' : '일시정지'}</button>`;
    },
    render(st) {
      const m = S.mon;
      if (!m) return;
      const t = $('#navTurn');
      const edge = m.edge ? `<div class="then edge">${icS('warn', 18)}<span>보호 구역 앞 정차 지점까지 안내 중</span></div>` : '';
      if (st.status === 'arrived') t.innerHTML = `<div class="arrow">${turnSvg('dest')}</div><div class="tx"><div class="d">${m.edge ? '정차 지점' : '도착'}</div><div class="v">${m.edge ? '보호 구역 앞입니다' : '목적지 부근입니다'}</div></div>`;
      else if (st.status === 'deviated') t.innerHTML = `<div class="arrow warn">${turnSvg('reroute')}</div><div class="tx"><div class="d">경로 이탈</div><div class="v">${S.settings.autoReroute ? '잠시 뒤 경로를 다시 찾습니다' : '경로로 돌아가 주세요'}</div></div>${edge}`;
      else if (st.nextMan) t.innerHTML = `<div class="arrow">${turnSvg(TURN_OF(st.nextMan.type))}</div><div class="tx"><div class="d">${navDist(st.nextMan.dist)}</div><div class="v">${esc(st.nextMan.verb)}</div>${st.nextMan.street ? `<div class="st">${esc(st.nextMan.street)}</div>` : ''}</div>${st.nextMan2 ? `<div class="then"><span class="k">그다음</span>${turnSvg(TURN_OF(st.nextMan2.type), 22)}<span>${esc(st.nextMan2.verb)}</span></div>` : ''}${edge}`;
      else t.innerHTML = `<div class="arrow">${turnSvg('straight')}</div><div class="tx"><div class="d">${navDist(st.remain)}</div><div class="v">경로를 따라 진행</div></div>${edge}`;
      $('#nvSpd').textContent = st.speed != null ? Math.round(st.speed * 3.6) : '-';
      const xe = $('#nvXte');
      xe.innerHTML = st.status === 'uncertain' ? '판단 보류' : `${Math.round(st.xte)}m <small>/ ${st.xtl}m</small>`;
      xe.className = st.status === 'deviated' ? 'bad' : st.status === 'uncertain' ? 'warn' : '';
      $('#nvAcc').textContent = `${Math.round(st.acc)}m${S.pos && S.pos.sim ? ' (모의)' : st.acc <= 15 ? '' : st.acc <= 50 ? ' (보통)' : ' (Wi-Fi 추정)'}`;
      $('#nvLv').textContent = LEVELS[m.mon.opts.level].label;
      $('#nvDist').innerHTML = navDist(st.remain);
      $('#nvTime').textContent = Util.fmtDur(st.remainTime);
      $('#nvEta').textContent = Number.isFinite(st.eta) ? Time.hm(st.eta) : '-';
      this.renderEco(st);
      this.measure();
    },
    renderEco(st) {
      const el = $('#navEco'), m = S.mon;
      if (!m || !st) return;
      const lv = m.mon.opts.level, now = Date.now();
      if (lv === 'normal') { el.classList.add('hidden'); return; }
      const al = this.ecoAlert && now < this.ecoUntil ? this.ecoAlert : null;
      let z = null, head = '', cls = '';
      if (st.inZone) { z = st.inZone; head = '구역 통과 중'; cls = 'in'; }
      else if (st.ttz && (st.ttz.dist <= (S.mode === 'car' ? 2500 : 800) || st.ttz.sec <= 600)) { z = st.ttz; head = `${navDist(st.ttz.dist).replace(/<\/?small>/g, '')} 앞, ${secText(st.ttz.sec)}`; cls = st.ttz.active ? 'ahead' : 'ahead off'; }
      if (!z) { el.classList.add('hidden'); return; }
      const key = z.temp ? 'T' : z.grade;
      const name = z.name.replace(/\((시험|예시)\)$/, '');
      const status = st.inZone ? (lv === 'protect' ? '천천히 지나가 주세요' : '') : z.active ? '지날 때 활동 시간대' : '지날 때 활동 시간대 아님';
      const act = lv === 'protect' && z.actions && z.actions.length ? `<div class="act">권고: ${esc(z.actions.slice(0, 2).join(', '))}</div>` : '';
      el.className = `nav-eco g-${key} ${cls}${al && al.id === z.id ? ' alert lv' + al.level : ''}`;
      el.innerHTML = `${gradeSvg(key)}<div class="grow"><div class="h">${head}</div><div class="n">${esc(name)}</div>${status ? `<div class="s">${status}</div>` : ''}${act}</div>`;
    },
    alert(a, st) {
      if (a.kind === 'approach' || a.kind === 'inzone') { this.ecoAlert = a; this.ecoUntil = Date.now() + (a.level >= 2 ? 15000 : 9000); this.renderEco(st); }
      else this.msg(a.text, a.level, a.kind === 'micro' ? 'micro' : '', a.kind === 'arrive' ? 0 : 9000);
      Voice.beep(a.level);
      Voice.say(a.text);
    },
    msg(text, level = 0, kind = '', ms = 9000) {
      const el = $('#navMsg');
      el.className = 'nav-msg lv' + level + (kind ? ' ' + kind : '');
      el.innerHTML = `${icS(kind === 'micro' ? 'ant' : level >= 2 ? 'warn' : 'info', 22)}<div class="grow">${esc(text)}</div><button class="x" data-n="msgClose" aria-label="닫기">${icS('close', 16)}</button>`;
      clearTimeout(this.msgTimer);
      if (ms) this.msgTimer = setTimeout(() => el.classList.add('hidden'), ms);
    },
    /* Big choices after the vehicle stops (or at once when walking). */
    choices(info) {
      const el = $('#navMsg');
      clearTimeout(this.msgTimer);
      el.className = 'nav-msg lv2 choices';
      el.innerHTML = `<div class="grow"><b>조건에 맞는 길이 없습니다</b><div class="s">${esc(info.why || '')}</div>
        <div class="nav-choice"><button class="btn" data-n="failLegal">법적 통제만 지키고 계속</button><button class="btn" data-n="failEdge">보호 구역 앞까지만 안내</button><button class="btn" data-n="failPick">다른 도착지 고르기</button><button class="btn danger" data-n="stop">안내 종료</button></div></div>`;
      if (S.mon) S.mon.pendingFail = null;
    },
    cmd(c) {
      const m = S.mon;
      if (S.locked && !c.startsWith('sim') && c !== 'msgClose') { toast('정차한 뒤 조작해 주세요.'); return; }
      if (c === 'msgClose') { $('#navMsg').classList.add('hidden'); return; }
      if (!m) return;
      if (c === 'stop') return App.stopMonitor();
      if (c === 'opts') return this.optsSheet();
      if (c === 'quick') return this.quickSheet();
      if (c === 'center') { S.followUntil = 0; if (m.last) App.follow(m.last, true); return; }
      if (c === 'failLegal') return App.applyFail('legal');
      if (c === 'failEdge') return App.applyFail('edge');
      if (c === 'failPick') { App.stopMonitor(); Pick.start('dest', '지도를 눌러 새 도착지를 고르세요'); return; }
      if (!m.sim) return;
      if (c === 'simPause') m.paused = !m.paused;
      if (c === 'simSpeed') { m.scale = m.scale === 1 ? 5 : m.scale === 5 ? 10 : 1; App.simLoop(); }
      if (c === 'simScen') {
        const order = ['normal', 'deviate', 'poor', 'stopgo'];
        const next = order[(order.indexOf(m.sim.o.scenario) + 1) % order.length];
        m.sim.o.scenario = next;
        toast({ normal: '정상 주행으로 바꿨습니다.', deviate: '경로 중간에서 옆길로 벗어나는 시나리오입니다.', poor: 'Wi-Fi처럼 정확도가 나쁜 위치를 만듭니다.', stopgo: '28초 달리고 12초 서는 신호 대기 시나리오입니다. 자동차라면 조작 잠금이 켜지고 풀리는 것을 볼 수 있습니다.' }[next], false, 5000);
      }
      this.simBar();
    },
    optsSheet() {
      const s = S.settings, m = S.mon;
      const cb = (k, l) => `<label class="check"><input type="checkbox" data-o="${k}" ${s[k] ? 'checked' : ''}><span>${l}</span></label>`;
      sheet('안내 설정', `<div class="field"><span class="lbl">안내 모드</span><div class="chips-sel">${LEVEL_CHIPS.map(([v, l]) => `<button data-s="lv" data-v="${v}" aria-pressed="${m.mon.opts.level === v}">${l}</button>`).join('')}</div></div>
        ${cb('voice', '음성 안내')}${cb('sound', '알림음')}${cb('liteNav', '안내 중 라이트 모드(구역을 도로 위에만)')}${cb('headingUp', '지도를 진행 방향으로 돌리기')}${cb('autoReroute', '벗어나면 자동으로 다시 찾기')}${cb('driveLock', '운전 중 화면 조작 잠금')}
        <div class="field" style="margin-top:6px"><label>운전 중 경로가 막혔을 때</label><select data-o="failPolicy">${Object.keys(POLICY).map((k) => `<option value="${k}" ${s.failPolicy === k ? 'selected' : ''}>${POLICY[k].label}</option>`).join('')}</select></div>
        <div class="btns" style="margin-top:10px"><button class="btn" data-s="reroute">${icS('refresh')}경로 다시 찾기</button><button class="btn" data-s="mute">${icS(m.muted ? 'sound' : 'mute')}${m.muted ? '소리 다시 켜기' : '이번 안내 소리 끄기'}</button></div>
        <p class="tiny muted">이 설정은 정차했을 때만 바꿀 수 있습니다.</p>`, (b, close) => {
        if (b.dataset.s === 'lv') { App.setLevel(b.dataset.v); close(); }
        if (b.dataset.s === 'reroute') { close(); App.reroute(false); }
        if (b.dataset.s === 'mute') { m.muted = !m.muted; if (m.muted && window.speechSynthesis) speechSynthesis.cancel(); close(); toast(m.muted ? '이번 안내의 소리를 껐습니다.' : '소리를 다시 켰습니다.'); }
      });
      $('#modal').onchange = (e) => {
        const k = e.target.dataset.o;
        if (!k) return;
        S.settings[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
        saveSettings(); App.afterSetting(k);
      };
    },
    quickSheet() {
      const tile = (k, icon, t1) => `<button class="qtile" data-s="qk" data-v="${k}">${ic(icon)}<b>${t1}</b></button>`;
      sheet('빠른 제보: 지금 이 자리', `<div class="qgrid">${tile('swarm', 'swarm', '벌레 떼')}${tile('dead', 'dead', '길 위 사체')}${tile('ant', 'ant', '개미굴(발밑 주의)')}</div>
        <p class="tiny muted" style="margin-top:8px">벌레 떼는 3시간, 사체는 오늘 밤까지, 개미굴은 지울 때까지 남습니다. 기간과 범위는 제보하기 화면에서 바꿀 수 있습니다.</p>`, (b, close) => {
        if (b.dataset.s !== 'qk') return;
        close();
        const k = b.dataset.v, dur = { swarm: '3h', dead: 'night', ant: 'keep' }[k];
        Quick.submit({ kind: k, dur, r: 60, ll: S.pos ? [S.pos.lon, S.pos.lat] : null, acc: S.pos ? S.pos.acc : null });
      });
    },
  };

  /* --------------------------------------------------- Driving lock -- */
  const Lock = {
    slowSince: null, lastSpeedT: 0,
    update(speedMs, t = Date.now()) {
      const on = !!S.settings.driveLock && S.mode === 'car';
      const kmh = speedMs == null || !Number.isFinite(speedMs) ? null : speedMs * 3.6;
      let want = S.locked;
      if (!on) want = false;
      else if (kmh == null) { if (S.locked && t - this.lastSpeedT > 15000) want = false; }
      else {
        this.lastSpeedT = t;
        if (kmh > LOCK_KMH) { want = true; this.slowSince = null; }
        else if (kmh <= UNLOCK_KMH) { if (this.slowSince == null) this.slowSince = t; if (t - this.slowSince >= UNLOCK_MS) want = false; }
        else this.slowSince = null;
      }
      if (want !== S.locked) this.set(want);
    },
    set(on) {
      S.locked = on;
      document.body.classList.toggle('locked', on);
      MV.setGestures(!on);
      if (on) {
        Ctx.hide(); Menu.hide(); LevelPop.hide();
        if (S.pick) Pick.cancel();
        const md = $('#modal');
        if (!md.classList.contains('hidden')) { md.classList.add('hidden'); md.innerHTML = ''; md.onclick = null; md.onchange = null; }
      }
      const nl = $('#nvLock');
      if (nl) nl.classList.toggle('hidden', !on);
      $('#lockPill').classList.toggle('hidden', !on || !!S.mon);
      if (!on && S.mon && S.mon.pendingFail) Nav.choices(S.mon.pendingFail);
    },
  };

  /* ------------------------------------------------- Real observations -- */
  /* GBIF occurrence search API and iNaturalist API v1, called straight from the browser (both allow CORS, no key).
     Only the test-area center rounded to 0.01 degree leaves the device. Results are kept 24 hours. */
  const Data = {
    busy: false,
    km: () => Util.clamp(+S.settings.obsKm || 3, 1, 5),
    key(c, km) { return [c[0].toFixed(2), c[1].toFixed(2), km, S.settings.obsGbif ? 'g' : '', S.settings.obsInat ? 'i' : ''].join('|'); },
    async load(force = false) {
      if (!S.settings.obsOn || !S.center || (!S.settings.obsGbif && !S.settings.obsInat)) { this.clear(); return; }
      if (this.busy) return;
      const c = Obs.roundCenter(S.center), km = this.km(), key = this.key(c, km);
      const cache = store.get('obsCache', null);
      if (!force && cache && cache.key === key && Date.now() - cache.t < 24 * 3600 * 1000 && Array.isArray(cache.recs)) {
        this.apply(cache.recs, cache.meta || {}, cache.t, cache.errs || []);
        return;
      }
      this.busy = true;
      S.obs.state = 'loading'; S.obs.err = '';
      Panel.refreshIf(['layers']);
      try {
        const out = await this.fetchAll(c, km);
        if (!out.recs.length && out.errs.length >= out.tried) throw new Error(out.errs.join(' ') || '응답이 없습니다.');
        const t = Date.now();
        store.set('obsCache', { key, t, recs: out.recs, meta: out.meta, errs: out.errs });
        this.apply(out.recs, out.meta, t, out.errs);
        toast(`관찰 기록 ${out.recs.length}건을 받았습니다 (GBIF ${out.meta.nG}건, iNaturalist ${out.meta.nI}건).`, false, 4500);
      } catch (e) {
        S.obs.state = 'error';
        S.obs.err = (e && e.message) || '연결하지 못했습니다.';
        Panel.refreshIf(['layers']);
        if (force) toast('관찰 기록을 받지 못했습니다. ' + S.obs.err, true);
      }
      this.busy = false;
    },
    async fetchAll(c, km) {
      const y = Time.kst(Date.now()).y, y0 = y - 14;
      const errs = [], meta = { nG: 0, nI: 0, dupInat: 0, skipped: 0, totalG: null, totalI: null, y0 };
      const tasks = [];
      if (S.settings.obsGbif) {
        tasks.push((async () => {
          const recs = [];
          let legacy = false;
          for (let off = 0; off < 900; off += 300) {
            let r = await Util.fetchJSON(Obs.gbifUrl(c, km, off, y0, y, legacy), {}, 20000);
            if (!r.ok && r.status === 400 && !legacy) { legacy = true; r = await Util.fetchJSON(Obs.gbifUrl(c, km, off, y0, y, true), {}, 20000); }
            if (!r.ok || !r.data || !Array.isArray(r.data.results)) throw new Error('GBIF에 ' + (r.status ? `요청했지만 오류(${r.status})가 났습니다.` : '연결하지 못했습니다.'));
            const p = Obs.parseGbif(r.data);
            recs.push(...p); meta.dupInat += p.dupInat; meta.skipped += p.skipped; meta.totalG = r.data.count;
            if (r.data.endOfRecords || r.data.results.length < 300) break;
          }
          return { src: 'gbif', recs };
        })().catch((e) => { errs.push(e.message); return { src: 'gbif', recs: [] }; }));
      }
      if (S.settings.obsInat) {
        tasks.push((async () => {
          const recs = [];
          for (let page = 1; page <= 2; page++) {
            const r = await Util.fetchJSON(Obs.inatUrl(c, km, page, `${y0}-01-01`), {}, 20000);
            if (!r.ok || !r.data || !Array.isArray(r.data.results)) throw new Error('iNaturalist에 ' + (r.status ? `요청했지만 오류(${r.status})가 났습니다.` : '연결하지 못했습니다.'));
            const p = Obs.parseInat(r.data);
            recs.push(...p); meta.skipped += p.skipped; meta.totalI = r.data.total_results;
            if (r.data.results.length < 200) break;
            await Util.sleep(1100); // well under the 60 requests per minute that iNaturalist asks for
          }
          return { src: 'inat', recs };
        })().catch((e) => { errs.push(e.message); return { src: 'inat', recs: [] }; }));
      }
      const res = await Promise.all(tasks);
      const all = Obs.dedupe(res.flatMap((r) => r.recs.map((q) => Object.assign({}, q))));
      meta.nG = all.filter((r) => r.src === 'gbif').length;
      meta.nI = all.filter((r) => r.src === 'inat').length;
      return { recs: all, meta, errs, tried: tasks.length };
    },
    apply(recs, meta, t, errs = []) {
      S.obs = { state: 'ok', n: recs.length, nG: meta.nG || 0, nI: meta.nI || 0, t, err: '', errs, records: new Map(recs.map((r) => [r.id, r])), meta };
      const today = Time.iso(t);
      const zones = Obs.cluster(recs, S.center, { cell: 200, today });
      S.zones = S.zones.filter((z) => !isObs(z)).concat(zones);
      S.gap = Obs.gaps(recs, S.center, this.km(), 300);
      S.gapZones = S.gap.cells.map((c) => Zones.normalize({ id: 'GAP-' + c.key, name: '자료 공백 격자', kind: 'eco', grade: 'U', q: 'Q4', legal: 'L2', modes: ['walk', 'car'], source: 'gap', verification: 'unverified', buffer: 0, updated: today, note: '공개 관찰 기록이 하나도 없는 300m 격자입니다.', geom: c.ring }));
      MV.drawZones(); MV.drawObs(); MV.drawGap(); renderChips();
      if (S.mon) App.refreshMonZones();
      Panel.refreshIf(['layers', 'editor', 'zone']);
    },
    clear() {
      S.obs = { state: 'idle', n: 0, nG: 0, nI: 0, t: 0, err: '', errs: [], records: new Map(), meta: null };
      S.zones = S.zones.filter((z) => !isObs(z)); S.gap = null; S.gapZones = [];
      if (MV.ready) { MV.drawZones(); MV.drawObs(); MV.drawGap(); }
      renderChips(); Panel.refreshIf(['layers']);
    },
  };

  /* ------------------------------------- Quick reports: temporary zones -- */
  /* Insects that appear for a while (a swarm, corpses on the road) become zones with an end time.
     Ant nests and similar tiny spots become step-carefully points that never change a route. */
  const Quick = {
    expiry(dur, ll, now = Date.now()) {
      const H = 3600000;
      if (dur === 'keep') return null;
      if (dur === '1h') return now + H;
      if (dur === '3h') return now + 3 * H;
      if (dur === '3d') return now + 72 * H;
      if (dur === '1w') return now + 168 * H;
      if (dur === 'night') { // until the next sunrise at that place
        const st = Sun.forT(now, ll[1], ll[0]);
        return now < st.rise ? st.rise : Sun.forT(now + 86400000, ll[1], ll[0]).rise;
      }
      return now + 3 * H;
    },
    submit({ kind, dur, r, ll, acc, taxa }) {
      if (!ll) { toast('위치를 아직 모릅니다. 현재 위치를 켜거나 지도에서 골라 주세요.', true); return null; }
      if (S.timeMode === 'custom') App.setTime(null); // a quick report is about now: show the map at the present time
      const now = Date.now(), today = Time.iso(now), id = Util.uid('Q');
      let exp = this.expiry(dur, ll, now), z;
      if (kind === 'ant') {
        z = Zones.normalize({ id, name: '발밑 주의: 개미굴(내 제보)', kind: 'micro', modes: ['walk'], mechanisms: ['trampling'], taxa: '개미류', actions: ['발밑 살피기', '개미굴 밟지 않기'], q: 'Q4', verification: 'unverified', source: 'report', buffer: 0, temp: exp != null, from: now, expires: exp, updated: today, note: '아주 작은 지점이라 경로를 바꾸지 않습니다. 생태 보호 모드로 걸을 때 15m 안에 들어오면 한 번 알립니다.', geom: Geo.circle(ll, 6, 12) });
      } else {
        if (exp == null) exp = now + 168 * 3600000;
        const swarm = kind === 'swarm', rad = Util.clamp(+r || 60, 20, 200);
        z = Zones.normalize({ id, name: (swarm ? '벌레 떼 출현' : '길 위 곤충 사체') + '(내 제보)', kind: 'eco', grade: 'E3', legal: 'L2', modes: ['walk', 'car'], mechanisms: swarm ? ['light', 'collision'] : ['trampling', 'collision'], taxa: taxa && taxa !== '모름' ? taxa : '', actions: swarm ? ['서행', '밤에는 불빛 줄이기', '피해 가기'] : ['밟지 않게 피해 가기', '서행'], q: 'Q4', verification: 'unverified', source: 'report', buffer: 10, temp: true, from: now, expires: exp, updated: today, note: '빠른 제보로 만든 임시 구역입니다. 기한이 지나면 저절로 사라집니다.', geom: Geo.circle(ll, rad, 32) });
      }
      S.zones.push(z); saveZones();
      S.reports.push({ id: Util.uid('R'), kind, taxa: kind === 'ant' ? '개미' : taxa || '모름', surface: '', mode: S.mode, t: now, ll, acc: Number.isFinite(acc) ? acc : null, vis: 'hidden', memo: '', photoId: null, status: 'unverified', created: now, quick: true, zoneId: z.id });
      store.set('reports', S.reports);
      MV.drawZones(); MV.drawReports(); renderChips();
      if (S.mon) App.refreshMonZones();
      App.planChanged(true);
      toast(kind === 'ant' ? '발밑 주의 지점을 만들었습니다. 경로는 바꾸지 않습니다.' : `임시 구역을 만들었습니다. ${Time.full(exp)}에 사라집니다.`, false, 4500);
      return z;
    },
    purge() {
      const now = Date.now();
      const gone = S.zones.filter((z) => z.temp && z.expires != null && z.expires <= now);
      if (!gone.length) return 0;
      S.zones = S.zones.filter((z) => !gone.includes(z));
      saveZones();
      if (S.selZone && gone.some((z) => z.id === S.selZone)) S.selZone = null;
      return gone.length;
    },
  };

  /* -------------------------------------------------------------- App -- */
  const App = {
    async boot() {
      Quick.purge();
      renderTopbar(); renderLegend(); renderChips();
      MV.init();
      Nav.build();
      this.bindUi();
      /* 0.3.1: the virtual test zones around the school are no longer placed by default.
         Clear the ones earlier versions saved on this device, once. */
      if (!store.get('demoCleared', false)) {
        const n = S.zones.filter(isDemo).length;
        S.zones = S.zones.filter((z) => !isDemo(z)); saveZones();
        S.settings.demoOn = false; saveSettings();
        S.terrainDone = false; store.set('terrainDone', false); store.del('terrainReport');
        store.set('demoCleared', true);
        if (n) setTimeout(() => toast(`시험용 가상 구역 ${n}곳을 해제했습니다. 설정에서 다시 켤 수 있어요.`, false, 6000), 1500);
      }
      if (S.settings.demoOn && S.center && !S.zones.some(isDemo)) { S.zones = Zones.demo(S.center).concat(S.zones); saveZones(); }
      if (!S.center) this.initCenter();
      else {
        if (S.settings.demoOn && !S.terrainDone) MV.map.once('idle', () => this.terrainFit(true));
        Data.load(false);
      }
      setInterval(() => this.tick(), 30000);
      try {
        if (navigator.permissions && navigator.permissions.query) {
          const p = await navigator.permissions.query({ name: 'geolocation' });
          if (p.state === 'granted') Loc.start(false);
          else $('#btnLocate').classList.add('pulse');
        } else $('#btnLocate').classList.add('pulse');
      } catch (e) { $('#btnLocate').classList.add('pulse'); }
      if (!store.get('welcomed2', false)) {
        store.set('welcomed2', true);
        setTimeout(() => toast('위쪽 안내 모드 버튼으로 일반, 생태 고려, 생태 보호를 고를 수 있어요. 지도를 길게 누르면 도착지와 빠른 제보 위치를 정할 수 있어요.', false, 7000), 6500);
      }
    },
    tick() {
      const n = Quick.purge();
      if (n) { MV.drawZones(); if (S.mon) this.refreshMonZones(); toast(`기한이 지난 임시 구역 ${n}곳을 지웠습니다.`); }
      if (S.timeMode === 'now' || n) { renderChips(); MV.drawZones(); Panel.refreshIf(['layers', 'zone', 'reports']); }
    },
    async initCenter() {
      let center = null, label = '';
      try {
        const res = await Geocoder.search('선덕고등학교', FALLBACK_CENTER);
        const hit = res.find((r) => /선덕고/.test(r.name) || /선덕고/.test(r.display));
        if (hit) { center = [hit.lon, hit.lat]; label = '선덕고등학교'; }
      } catch (e) { /* offline or blocked */ }
      if (!center) { center = FALLBACK_CENTER; label = '쌍문역 부근(대략)'; toast('선덕고 위치를 찾지 못해 쌍문역 주변으로 시작합니다. 지도를 길게 눌러 시험 지역 중심을 바꿀 수 있어요.', false, 7000); }
      this.setCenter(center, label, true);
    },
    setCenter(ll, label, auto = false) {
      S.center = ll; S.centerLabel = label || fmtLL(ll);
      store.set('center', S.center); store.set('centerLabel', S.centerLabel);
      const keep = S.zones.filter((z) => !isDemo(z) && !isObs(z));
      S.zones = (S.settings.demoOn ? Zones.demo(ll) : []).concat(keep);
      saveZones();
      S.terrainDone = false; store.set('terrainDone', false);
      MV.drawZones(); MV.drawCenter(); renderChips(); Panel.refreshIf(['layers', 'editor']);
      MV.map.flyTo({ center: ll, zoom: 14.6, padding: MV.camPad(), duration: 900 });
      if (S.settings.demoOn) MV.map.once('moveend', () => MV.map.once('idle', () => this.terrainFit(true)));
      Data.load(false);
      if (!auto) toast(`시험 지역을 ${S.centerLabel} 주변으로 옮겼습니다.`);
    },
    terrainFit(auto = false) {
      if (!S.center || !S.settings.demoOn) return;
      const getFeatures = (layer) => {
        if (window.__NAVI_TEST_TERRAIN) return window.__NAVI_TEST_TERRAIN[layer] || [];
        try { return MV.map.getSource('openmaptiles') ? MV.map.querySourceFeatures('openmaptiles', { sourceLayer: layer }) : []; } catch (e) { return []; }
      };
      const run = () => {
        const base = Zones.demo(S.center);
        const out = Terrain.fit(base, S.center, getFeatures);
        if (!out.report.length) { if (!auto) toast('주변 지도에서 하천이나 녹지를 찾지 못해 기본 배치를 유지합니다.'); return; }
        const keep = S.zones.filter((z) => !isDemo(z));
        S.zones = out.zones.concat(keep);
        saveZones(); S.terrainDone = true; store.set('terrainDone', true);
        S.terrainReport = out.report; store.set('terrainReport', out.report);
        MV.drawZones(); Panel.refreshIf(['layers', 'editor']);
        toast(`${S.centerLabel || '시험 지역'} 주변 지형(하천, 녹지)에 맞춰 시험 구역을 배치했습니다.`, false, 5000);
      };
      const near = Geo.dist([MV.map.getCenter().lng, MV.map.getCenter().lat], S.center) < 800 && MV.map.getZoom() >= 13.8;
      if (near && MV.map.loaded()) run();
      else { MV.map.flyTo({ center: S.center, zoom: 14.6, duration: 600 }); MV.map.once('moveend', () => MV.map.once('idle', run)); }
    },
    bindUi() {
      $('#searchForm').onsubmit = (e) => { e.preventDefault(); this.search($('#searchInput').value); $('#searchInput').blur(); };
      $('#modeSeg').onclick = (e) => { const b = e.target.closest('[data-mode]'); if (b) this.setMode(b.dataset.mode); };
      $('#levelBtn').onclick = (e) => { e.stopPropagation(); Menu.hide(); LevelPop.toggle(); };
      $('#menuBtn').onclick = () => { LevelPop.hide(); Menu.toggle(); };
      $('#panelClose').onclick = () => Panel.close();

    async addPhoto(file) {
      if (!file || !S.draft) return;
      try {
        const url = URL.createObjectURL(file);
        const img = new Image();
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
        const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.82));
        const id = Util.uid('P');
        try { await IDB.put(id, blob); S.draft.photoId = id; } catch (e) { toast('사진을 기기에 저장하지 못했습니다. 사진 없이 제보할 수 있습니다.', true); }
        S.draft.photoUrl = URL.createObjectURL(blob);
        Panel.render();
      } catch (e) { toast('사진을 읽지 못했습니다.', true); }

        const v = await modal('구역 가져오기', `${zs.length}개 구역을 찾았습니다. 어떻게 할까요?`, [{ label: '기존 구역에 추가', cls: 'primary', value: 'merge' }, { label: '모두 바꾸기', value: 'replace' }, { label: '취소', value: null }]);

    },
    /* ------------------------------ planning ------------------------------ */
    async planRoute() {
      const pl = S.plan;
      const origin = pl.origin.kind === 'gps' ? (S.pos ? [S.pos.lon, S.pos.lat] : null) : pl.origin.ll;
      if (!origin) { toast('현재 위치를 아직 모릅니다. 위치 권한을 허용하거나 출발점을 지도에서 골라 주세요.', true); return; }
      if (!pl.dest) { toast('도착지를 먼저 정해 주세요.', true); return; }
      if (Geo.dist(origin, pl.dest.ll) < 15) { toast('출발지와 도착지가 너무 가깝습니다.', true); return; }
      const lv = S.level, L = LEVELS[lv];

      MV.drawRoutes(); Panel.render();

        });

          const all = res.cands.filter((c) => !c.ev.violations.length).flatMap((c) => c.route.coords);
          if (res.entryLeg) all.push(res.entryLeg.to);
          if (res.exitLeg) all.push(res.exitLeg.from);
          MV.fit(all);
        } else if (res.problems && res.problems[0]) {
          S.selZone = res.problems[0].id; MV.drawZones();
          MV.fit([origin, pl.dest.ll].concat(Zones.workGeom(res.problems[0])));
        }
      } catch (e) {
        const hint = { network: '인터넷 연결을 확인하세요. 계속 안 되면 설정에서 경로 서버를 바꿔 보세요.', timeout: '잠시 뒤 다시 시도해 주세요.', rate: '1분쯤 기다렸다가 다시 시도해 주세요.', toolong: '도착지를 더 가까운 곳으로 정하거나 경유점을 넣어 나눠 보세요.', auth: '설정의 경로 서버와 키를 확인해 주세요.', config: '설정에서 경로 서버 주소를 확인해 주세요.' }[e.kind] || '';
        S.planError = { msg: e.message || '경로를 찾지 못했습니다.', hint };
      }
      S.planning = false;
      MV.drawRoutes(); Panel.render();
    },
    /* ----------------------------- guidance ------------------------------- */
    monOpts(car) {
      const st = S.settings;
      return { mode: S.mode, xtl: car ? st.xtlCar : st.xtlWalk, a1: car ? st.aCar1 : st.aWalk1, a1m: car ? st.aCar1m : st.aWalk1m, a2: car ? st.aCar2 : st.aWalk2, zones: planZones(), t0: departT(), eco: S.eco, level: S.level, microAlert: !!st.microAlert };
    },
    startMonitor(sim) {
      const R = S.result, sel = R && R.cands && R.cands.find((c) => c.cid === S.selCid);
      if (!sel) return;
      if (!sim && !S.pos) { toast('현재 위치를 아직 모릅니다. 위치 권한을 허용해 주세요. 집에서 시험하려면 모의 항해를 쓰세요.', true); Loc.start(true); return; }
      Voice.unlock();
      const car = S.mode === 'car';
      const wps = S.plan.waypoints.map((w, i) => ({ ll: w.ll, name: w.label || '경유점 ' + (i + 1) }));
      const mon = new Monitor({ route: sel.route, ev: sel.ev, waypoints: wps }, this.monOpts(car));
      S.mon = { mon, sim: null, timer: null, muted: false, paused: false, scale: 1, startedAt: Date.now(), devCount: 0, cid: sel.cid, edge: null, pendingFail: null };
      if (sim) {
        const simr = new Simulator(sel.route.coords, { kmh: car ? 35 : 5, acc: 8, noise: 2, scenario: 'normal' });
        simr.t = departT();

        this.simLoop();
      } else {
        Wake.on();
        Loc.start(false);
      }
      Panel.close(); Ctx.hide(); Menu.hide(); LevelPop.hide();
      S.followUntil = 0;
      Nav.show(true); Nav.simBar(); Nav.note();
      MV.applyLite(); MV.drawRoutes(); MV.drawWaypoints(); renderLegend();
      $('#navTurn').innerHTML = `<div class="arrow">${turnSvg('straight')}</div><div class="tx"><div class="d">출발</div><div class="v">${sim ? '모의 항해를 시작합니다' : '안내를 시작합니다'}</div></div>`;
      Nav.msg(`${LEVELS[S.level].full}로 안내합니다.${S.level === 'normal' ? ' 곤충 구역 알림은 울리지 않습니다.' : ''}${isLite() ? ' 구역은 도로 위에만 표시합니다.' : ''}`, 0, '', 6000);
      Voice.say(sim ? '모의 항해를 시작합니다.' : '안내를 시작합니다.');
      if (S.pos && !sim) this.onFix({ lon: S.pos.lon, lat: S.pos.lat, acc: S.pos.acc, speed: S.pos.speed, heading: S.pos.heading, t: Date.now() });
      MV.map.easeTo({ center: sel.route.coords[0], zoom: Math.max(MV.map.getZoom(), car ? 15.5 : 16.5), padding: Nav.pad(), duration: 600 });
    },
    simLoop() {
      const m = S.mon;
      if (!m || !m.sim) return;
      clearInterval(m.timer);
      m.timer = setInterval(() => {
        if (m.paused || S.mon !== m) return;
        const f = m.sim.next(1);
        S.pos = { lon: f.lon, lat: f.lat, acc: f.acc, speed: f.speed, heading: null, t: f.t, sim: true };
        this.onFix(f);
        if (f.done) { clearInterval(m.timer); m.timer = null; }
      }, Math.round(1000 / m.scale));
    },
    onFix(f) {
      const m = S.mon;
      if (!m) return;
      const st = m.mon.update(f);
      m.last = st;
      if (st.status === 'deviated') m.devCount++;
      Lock.update(st.speed, f.t);
      MV.drawPos(); renderChips();
      Nav.render(st);
      for (const a of st.alerts) Nav.alert(a, st);
      if (st.reroute && S.settings.autoReroute) this.reroute(true);
      if (st.status === 'arrived' && !m.arrived) {
        m.arrived = true;
        if (m.edge) {
          Nav.alert({ level: 1, kind: 'arrive', text: '보호 구역 앞에 왔습니다. 안전한 곳에 정차한 뒤 다른 방법을 골라 주세요.' }, st);
          m.pendingFail = { why: m.edge.why };
          if (!S.locked) Nav.choices(m.pendingFail);
        } else Nav.alert({ level: 0, kind: 'arrive', text: '목적지에 도착했습니다.' }, st);
        if (m.sim) { clearInterval(m.timer); m.timer = null; }

    follow(st, force = false) {
      if (!S.mon || !st || (!force && Date.now() <= S.followUntil)) return;
      const t = performance.now(), dt = this._lastFollow ? t - this._lastFollow : 1000;
      this._lastFollow = t;
      const car = S.mode === 'car', hu = !!S.settings.headingUp;
      const pad = Nav.pad();
      if (hu) pad.top += Math.round(window.innerHeight * (car ? 0.18 : 0.08));
      const cam = { center: st.ll, bearing: hu && st.bearing != null ? st.bearing : 0, pitch: hu && car ? 40 : 0, padding: pad };
      // Fast simulation sends several fixes per second: jump instead of stacking animations that lag behind.
      if (!force && dt < 300) MV.map.jumpTo(cam);
      else MV.map.easeTo(Object.assign(cam, { duration: force ? 600 : Math.min(450, Math.round(dt * 0.8)) }));
    },
    refreshMonZones() {
      const m = S.mon;
      if (!m) return;
      const zs = planZones(), lv = m.mon.opts.level;
      const ev = Cost.evaluate(m.mon.route, { zones: zs, mode: S.mode, t0: Date.now(), eco: LEVELS[lv].eco, settings: levelSettings(lv) });
      m.mon.setZones(zs, ev.events);
    },
    /* Follow a new route without leaving guidance. */
    adopt(cand, res, wps) {
      const m = S.mon;

      const o = m.mon.opts, track = m.mon.track;
      m.mon = new Monitor({ route: cand.route, ev: cand.ev, waypoints: (wps || []).map((w, i) => ({ ll: w.ll, name: w.label || '경유점 ' + (i + 1) })) }, Object.assign({}, o, { t0: Date.now(), zones: planZones() }));
      m.mon.track = track;
      m.arrived = false;
      if (m.sim) { const sp = m.sim.o, t = m.sim.t; m.sim = new Simulator(cand.route.coords, sp); m.sim.t = t; }
      MV.drawRoutes();
    },
    async reroute(auto) {
      const m = S.mon;

      const from = S.pos ? [S.pos.lon, S.pos.lat] : null;
      if (!from) return;
      m.rerouting = true;
      Nav.msg(auto ? '경로에서 벗어나 경로를 다시 찾습니다.' : '경로를 다시 찾습니다.', 0, '', 6000);
      try {
        const st = m.last;
        const remainWps = S.plan.waypoints.filter((w) => { const mw = m.mon.waypoints.find((q) => q.ll === w.ll); return !mw || !st || mw.s > st.s; });
        const lv = S.level;
        const res = await Planner.plan({ origin: from, dest: S.plan.dest.ll, waypoints: remainWps.map((w) => ({ ll: w.ll })), mode: S.mode, t0: Date.now(), eco: LEVELS[lv].eco, zones: planZones(), settings: Object.assign(levelSettings(lv), { maxCandidates: 2 }) });
        if (S.mon !== m) return;
        if (res.status === 'fail') await this.onRerouteFail(res);
        else {
          res.level = lv;
          m.edge = null;
          this.adopt(res.sel.rec, res, remainWps);
          Voice.say('새 경로로 안내합니다.');
          Nav.msg('새 경로로 안내합니다.', 0, '', 5000);
        }
      } catch (e) { Nav.msg('경로를 다시 찾지 못했습니다. ' + (e.message || ''), 2); }
      finally { m.rerouting = false; }
    },
    /* A blocked route during guidance. Driving (screen locked): apply the preset policy without asking.
       Walking or stopped: show big choices at once. */
    async onRerouteFail(res) {
      const m = S.mon;
      const probs = res.problems || [];
      const why = probs.length ? `${probs.slice(0, 2).map(zoneName).join(', ')} 때문에 지금은 갈 수 있는 길이 없습니다.` : '보호 구역 때문에 지금은 갈 수 있는 길이 없습니다.';
      if (!S.locked) {
        m.pendingFail = { why };
        Voice.say('조건에 맞는 길이 없습니다. 화면에서 방법을 골라 주세요.');
        Nav.choices(m.pendingFail);
        return;
      }
      const pol = S.settings.failPolicy;
      if (pol === 'stop') {
        m.pendingFail = { why };
        const msg = '조건에 맞는 길이 없습니다. 안전한 곳에 정차하면 고를 수 있는 방법을 보여 드립니다.';
        Voice.say(msg); Nav.msg(msg, 2, '', 0);
        return;
      }
      await this.applyFail(pol, why);
    },
    async applyFail(kind, why = '') {
      const m = S.mon;
      if (!m) return;
      $('#navMsg').classList.add('hidden');
      m.pendingFail = null;
      const from = S.pos ? [S.pos.lon, S.pos.lat] : m.last ? m.last.ll : null;
      if (!from || !S.plan.dest) return;
      const dest = S.plan.dest.ll, now = Date.now();
      try {
        if (kind === 'legal') {
          const res = await Planner.plan({ origin: from, dest, waypoints: [], mode: S.mode, t0: now, eco: false, zones: planZones(), settings: Object.assign(levelSettings('normal'), { maxCandidates: 1 }) });
          if (S.mon !== m) return;
          if (res.status !== 'fail') {
            res.level = 'normal';
            m.edge = null;
            this.adopt(res.sel.rec, res, []);
            const lv = m.mon.opts.level;
            if (lv !== 'normal') m.mon.setEvents(Cost.evaluate(res.sel.rec.route, { zones: planZones(), mode: S.mode, t0: now, eco: true, settings: levelSettings(lv) }).events);
            const msg = '생태 조건을 만족하는 길이 없어, 설정에 따라 법적 통제만 지키는 길로 안내합니다. 구역을 지날 때는 천천히 가 주세요.';
            Voice.say(msg); Nav.msg(msg, 1, '', 12000);
            return;
          }
          kind = 'edge';
        }
        if (kind === 'edge') {
          const e = await Planner.toEdge({ origin: from, dest, mode: S.mode, t0: now, eco: S.eco, zones: planZones(), settings: levelSettings() });
          if (S.mon !== m) return;
          if (e.status === 'edge') {
            const cand = { cid: 'EDGE', route: e.route, ev: e.ev, tag: 'edge' };
            const res = { status: 'ok', cands: [cand], sel: { rec: cand, fastest: cand, ecoBest: cand, ecoMinAll: cand.ev.eco }, notes: [], hard: [], level: S.level };
            this.adopt(cand, res, []);
            m.edge = { target: e.target, zone: e.zone, why: `${zoneName(e.zone)} 앞입니다. 지금은 이 구역을 지나갈 수 없습니다.` };
            MV.drawWaypoints();
            const msg = `${zoneName(e.zone)} 앞까지만 안내합니다. 도착하면 안전한 곳에 정차한 뒤 다른 방법을 골라 주세요.`;
            Voice.say(msg); Nav.msg(msg, 1, '', 12000);
            return;
          }
          if (e.status === 'at-edge') why = '이미 보호 구역 앞입니다. ' + (why || '');
        }
        m.pendingFail = { why: why || '갈 수 있는 길을 찾지 못했습니다.' };
        const msg = '조건에 맞는 길이 없습니다. 안전한 곳에 정차하면 고를 수 있는 방법을 보여 드립니다.';
        Voice.say(msg);
        if (!S.locked) Nav.choices(m.pendingFail); else Nav.msg(msg, 2, '', 0);
      } catch (err) { Nav.msg('다른 길을 찾지 못했습니다. ' + (err.message || ''), 2); }
    },
    stopMonitor() {
      const m = S.mon;
      if (!m) return;
      clearInterval(m.timer);
      Wake.off();
      if (window.speechSynthesis) speechSynthesis.cancel();
      const mins = Math.round((Date.now() - m.startedAt) / 60000);
      const track = m.mon.track.slice();
      S.mon = null;
      if (S.pos && S.pos.sim) S.pos = S.realPos ? Object.assign({}, S.realPos) : null;
      Nav.show(false);
      Lock.update(S.pos && Number.isFinite(S.pos.speed) ? S.pos.speed : null);
      MV.applyLite(); renderLegend();
      MV.drawRoutes(); MV.drawPos(); MV.drawWaypoints(); renderChips();
      MV.map.easeTo({ bearing: 0, pitch: 0, padding: MV.camPad(), duration: 500 });
      if (S.settings.trackConsent && track.length > 1) {
        const gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="NAVI ${NaviCore.NAVI_VERSION}" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>NAVI track</name><trkseg>${track.map((p) => `<trkpt lat="${p[1].toFixed(6)}" lon="${p[0].toFixed(6)}"/>`).join('')}</trkseg></trk></gpx>`;
        download(`navi-track-${stamp()}.gpx`, gpx, 'application/gpx+xml');
      }
      toast(`안내를 마쳤습니다. ${mins ? mins + '분 동안 ' : ''}이탈 판정 ${m.devCount ? '있음' : '없음'}.`);
      Panel.open('plan');
    },
  };

    exportAll: () => download(`navi-backup-${stamp()}.json`, JSON.stringify({ app: 'NAVI', version: NaviCore.NAVI_VERSION, level: S.level, zones: Zones.toGeoJSON(S.zones.filter((z) => !isObs(z))), reports: S.reports, settings: Object.assign({}, S.settings, { stadiaKey: '' }), center: S.center, centerLabel: S.centerLabel }, null, 1), 'application/json'),
    clearAll: async () => {
      const ok = await modal('모두 지우기', '구역, 제보, 설정, 받은 관찰 기록을 이 기기에서 모두 지웁니다. 되돌릴 수 없습니다.', [{ label: '모두 지우기', cls: 'danger', value: true }, { label: '취소', value: false }]);
      if (!ok) return;
      try { Object.keys(localStorage).filter((k) => k.startsWith(KEY)).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* ignore */ }
      try { indexedDB.deleteDatabase('navi'); } catch (e) { /* ignore */ }
      location.reload();
    },
  };

  /* ---------------------------------------------------------- Location -- */
  const Loc = {
    firstFixFly: false,
    start(fly) {
      if (!('geolocation' in navigator)) { S.posErr = '이 브라우저는 위치 기능을 지원하지 않습니다.'; renderChips(); return; }
      if (fly) this.firstFixFly = true;
      if (S.watchId != null) return;
      $('#btnLocate').classList.remove('pulse');
      S.watchId = navigator.geolocation.watchPosition((p) => this.onPos(p), (e) => this.onErr(e), { enableHighAccuracy: true, maximumAge: 1500, timeout: 30000 });
    },
    locateBtn() {
      if (S.pos && !S.pos.sim) { MV.flyTo([S.pos.lon, S.pos.lat], Math.max(MV.map.getZoom(), 16)); S.followUntil = 0; return; }
      if (S.watchId != null && S.posErr) { navigator.geolocation.clearWatch(S.watchId); S.watchId = null; }
      S.posErr = null; renderChips();
      this.start(true);
      toast('위치를 찾는 중입니다.');
    },
    onPos(p) {
      const c = p.coords;
      const first = !S.realPos;
      S.realPos = { lon: c.longitude, lat: c.latitude, acc: c.accuracy, speed: c.speed, heading: c.heading, t: p.timestamp || Date.now() };
      if (S.mon && S.mon.sim) return;
      S.pos = Object.assign({}, S.realPos);
      S.posErr = null;
      MV.drawPos(); renderChips();
      if (this.firstFixFly) { this.firstFixFly = false; MV.flyTo([S.pos.lon, S.pos.lat], 16); }
      if (S.mon && !S.mon.sim) App.onFix({ lon: S.pos.lon, lat: S.pos.lat, acc: S.pos.acc, speed: c.speed, heading: c.heading, t: Date.now() });
      else Lock.update(c.speed);
      if (first) Panel.refreshIf(S.panel && ((S.panel.name === 'plan' && S.plan.origin.kind === 'gps' && !S.planning) || S.panel.name === 'report') ? [S.panel.name] : []);
    },
    onErr(e) {
      const msg = e.code === 1 ? '위치 권한이 꺼져 있습니다. 설정 앱의 개인정보 보호 및 보안에서 위치 서비스와 Safari 웹사이트 권한을 확인해 주세요.' : e.code === 3 ? '위치를 받는 데 시간이 걸리고 있습니다.' : '위치를 확인하지 못했습니다.';
      S.posErr = e.code === 1 ? '위치 권한 꺼짐' : e.code === 3 ? '위치 대기 중' : '위치 확인 실패';
      renderChips();
      if (e.code !== 3) toast(msg, true, 6500);
    },
  };

  window.NAVI = { S, App, MV, Panel, Actions, Loc, Editor, Nav, Lock, Data, Quick, RoadZones, LevelPop, Cases, KB, LIB, core: NaviCore };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.boot());
  else App.boot();
})();

}
</script>
</body>
</html>
